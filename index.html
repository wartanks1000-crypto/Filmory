/* ----- Messagerie ----- */
const chat = {open: false, peer: null, msgs: [], attach: null, picking: false, hits: [], pickToken: 0, draft: "", ch: null};
const peerOf = m => m.sender === myId() ? m.recipient : m.sender;
const unreadFrom = peer => chat.msgs.filter(m => m.recipient === myId() && !m.read_at && (!peer || m.sender === peer)).length;
async function loadMessages() {
  const {data, error} = await auth.sb.from("messages").select("*").order("created_at", {ascending: false}).limit(500);
  if (error) return;
  chat.msgs = (data || []).reverse();
  await loadPeople([...chat.msgs.map(peerOf), ...state.profile.friends]);
  paintChatFab(); if (chat.open) renderChat();
}
function startChat() {
  if (!auth.user || chat.ch) return;
  $("#chat").hidden = false;
  loadMessages();
  chat.ch = auth.sb.channel("rt-chat").on("postgres_changes", {event: "INSERT", schema: "public", table: "messages", filter: `recipient=eq.${myId()}`}, async p => {
    const m = p.new;
    if (chat.msgs.some(x => x.id === m.id)) return;
    chat.msgs.push(m);
    await loadPeople([m.sender]);
    if (chat.open && chat.peer === m.sender) { paintChatMsgs(); markChatRead(m.sender); }
    else { toast(`Nouveau message de ${nameOf(m.sender)}`); if (chat.open && !chat.peer) renderChat(); }
    paintChatFab();
  }).subscribe();
}
function paintChatFab() {
  const n = unreadFrom(), c = $("#chatCount");
  c.hidden = !n; c.textContent = n > 9 ? "9+" : n;
  $("#chatFab").setAttribute("aria-label", n ? `Messages, ${n} non lu${n > 1 ? "s" : ""}` : "Messages");
}
async function markChatRead(peer) {
  const list = chat.msgs.filter(m => m.sender === peer && m.recipient === myId() && !m.read_at);
  if (!list.length) return;
  const now = new Date().toISOString();
  list.forEach(m => m.read_at = now); paintChatFab();
  await auth.sb.from("messages").update({read_at: now}).eq("recipient", myId()).eq("sender", peer).is("read_at", null);
}
function openChat(peer = null, attach) {
  if (!auth.user) { if (auth.sb) openAuth("login"); toast("Connectez-vous pour discuter avec vos amis."); return; }
  chat.open = true; chat.peer = peer; chat.picking = false;
  if (attach !== undefined) chat.attach = attach;
  if (peer) { chat.draft = ""; markChatRead(peer); loadPeople([peer]).then(() => chat.open && chat.peer === peer && renderChat()); }
  const panel = $("#chatPanel"), wasHidden = panel.hidden;
  chat.closeAnim?.cancel(); chat.closeAnim = null;
  panel.hidden = false; $("#chatFab").setAttribute("aria-expanded", "true");
  placeChatPanel();
  renderChat();
  if (wasHidden && !reducedMotion()) inflateChat(panel);
}
// Ouverture : la fenêtre se gonfle depuis la bulle, comme une bulle de savon qui grossit
function inflateChat(panel) {
  const fab = $("#chatFab").getBoundingClientRect(), p = panel.getBoundingClientRect(), o = chatOrigin(p);
  const dx = fab.left + fab.width / 2 - o.x, dy = fab.top + fab.height / 2 - o.y;
  panel.animate([
    {transform: `translate(${dx}px,${dy}px) scale(.12)`, borderRadius: "50%", opacity: .2, filter: "blur(4px)"},
    {transform: "translate(0,0) scale(1.04,.97)", borderRadius: "28px", opacity: 1, filter: "blur(0)", offset: .65},
    {transform: "scale(.985,1.015)", borderRadius: "18px", offset: .85},
    {transform: "none", borderRadius: "16px"},
  ], {duration: 520, easing: "cubic-bezier(.2,.8,.2,1)"});
  $("#chatFab").animate([{transform: "scale(1)"}, {transform: "scale(1.18,.86)"}, {transform: "scale(.94,1.06)"}, {transform: "scale(1)"}], {duration: 420, easing: "ease-out"});
}
function closeChat() {
  if (!chat.open) return;
  chat.open = false; chat.picking = false;
  const panel = $("#chatPanel"), fab = $("#chatFab");
  fab.setAttribute("aria-expanded", "false");
  if (reducedMotion() || panel.hidden) { panel.hidden = true; return; }
  // Fermeture : la fenêtre rentre dans la bulle, puis la bulle éclate et se reforme
  const f = fab.getBoundingClientRect(), p = panel.getBoundingClientRect(), o = chatOrigin(p);
  const dx = f.left + f.width / 2 - o.x, dy = f.top + f.height / 2 - o.y;
  const anim = chat.closeAnim = panel.animate([
    {transform: "none", borderRadius: "16px", opacity: 1},
    {transform: `translate(${dx}px,${dy}px) scale(.1)`, borderRadius: "50%", opacity: 0},
  ], {duration: 260, easing: "cubic-bezier(.5,0,.75,0)"});
  setTimeout(() => { if (chat.closeAnim === anim) anim.finish(); }, 450); // onglet en arrière-plan : animations gelées
  anim.finished.then(() => {
    if (chat.closeAnim !== anim) return;
    chat.closeAnim = null; panel.hidden = true; popBubble(fab);
  }).catch(() => {});
}
function popBubble(fab) {
  const r = fab.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  const pop = document.createElement("div"); pop.className = "pop"; pop.style.cssText = `left:${cx}px;top:${cy}px`;
  const ring = document.createElement("b"); pop.appendChild(ring);
  ring.animate([{transform: "scale(.9)", opacity: .9}, {transform: "scale(2.1)", opacity: 0}], {duration: 380, easing: "ease-out", fill: "forwards"});
  for (let i = 0; i < 12; i++) {
    const d = document.createElement("i"), a = (i / 12) * Math.PI * 2 + Math.random() * .4, dist = 34 + Math.random() * 30, s = .5 + Math.random() * .8;
    pop.appendChild(d);
    d.animate([{transform: `translate(${Math.cos(a) * 22}px,${Math.sin(a) * 22}px) scale(${s})`, opacity: 1},
      {transform: `translate(${Math.cos(a) * dist}px,${Math.sin(a) * dist + 18}px) scale(${s * .3})`, opacity: 0}],
      {duration: 420 + Math.random() * 200, easing: "cubic-bezier(.1,.7,.3,1)", fill: "forwards"});
  }
  document.body.appendChild(pop);
  fab.animate([
    {transform: "scale(1)", opacity: 1},
    {transform: "scale(1.25)", opacity: .9, offset: .12},
    {transform: "scale(0)", opacity: 0, offset: .2},
    {transform: "scale(0)", opacity: 0, offset: .55},
    {transform: "scale(1.12,.9)", opacity: 1, offset: .82},
    {transform: "scale(1)", opacity: 1},
  ], {duration: 900, easing: "ease-out"});
  setTimeout(() => pop.remove(), 700);
}
const filmLine = f => `${poster(f, {mini: true})}<span style="min-width:0"><b>${esc(f.title)}</b><small>${[f.year, kindLabel(f.t)].filter(Boolean).join(" · ")}</small></span>`;
function msgHTML(m) {
  const mine = m.sender === myId();
  if (m.title) registerTitles([m.title]);
  const f = m.title && byId(m.title.id);
  return `<div class="cm ${mine ? "mine" : ""}">${f ? `<button class="cm-film" data-open="${esc(f.id)}">${poster(f, {mini: true})}<span style="min-width:0"><small>${mine ? "Vous conseillez" : "Vous conseille"}</small><b>${esc(f.title)}</b><small>${[f.year, kindLabel(f.t)].filter(Boolean).join(" · ")}</small></span></button>` : ""}${m.body ? `<p>${esc(m.body)}</p>` : ""}<time>${ago(m.created_at)}</time></div>`;
}
function paintChatMsgs() {
  const box = $("#chatMsgs"); if (!box) return;
  const list = chat.msgs.filter(m => peerOf(m) === chat.peer);
  box.innerHTML = list.length ? list.map(msgHTML).join("") : `<div class="ch-empty">Écrivez votre premier message${chat.attach ? "" : " ou conseillez un film avec le bouton 🎬"}.</div>`;
  box.scrollTop = box.scrollHeight;
}
function renderChat() {
  const panel = $("#chatPanel"), x = `<button class="ch-x" data-chat="close" aria-label="Fermer la messagerie">×</button>`;
  if (!chat.peer) {
    const last = {};
    chat.msgs.forEach(m => { last[peerOf(m)] = m; });
    const convs = Object.keys(last).sort((a, b) => last[b].created_at.localeCompare(last[a].created_at));
    const others = state.profile.friends.filter(id => !last[id]);
    const row = id => { const m = last[id], n = unreadFrom(id), name = nameOf(id);
      return `<button class="ch-peer" data-peer="${esc(id)}">${avHTML(id, name)}<span class="pm"><b>${esc(name)}</b><small>${m ? `${m.sender === myId() ? "Vous : " : ""}${m.title && !m.body ? "🎬 " + esc(m.title.title || "") : esc(m.body)} · ${ago(m.created_at)}` : "Ami·e · démarrer une conversation"}</small></span>${n ? `<span class="ud" aria-label="${n} non lu${n > 1 ? "s" : ""}"></span>` : ""}</button>`; };
    panel.innerHTML = `<div class="ch-head"><b>Messages</b>${x}</div>
      <div class="ch-body">
        ${chat.attach ? `<div class="ch-note">À qui voulez-vous conseiller <b>${esc(chat.attach.title)}</b> ? <button class="linkish" data-chat="rm-attach" style="font-size:12.5px;color:var(--muted)">Annuler</button></div>` : ""}
        ${convs.length ? `<div class="ch-k">Conversations</div>${convs.map(row).join("")}` : ""}
        ${others.length ? `<div class="ch-k">Amis</div>${others.map(row).join("")}` : ""}
        ${!convs.length && !others.length ? `<div class="ch-empty">Ajoutez des amis pour discuter avec eux et vous conseiller des films.<a class="btn small primary" href="#amis" data-chat="close">Trouver des amis</a></div>` : ""}
      </div><div></div>`;
    return;
  }
  const name = nameOf(chat.peer);
  panel.innerHTML = `<div class="ch-head"><button class="ch-x" data-chat="back" aria-label="Toutes les conversations">${ICON.back}</button>${avHTML(chat.peer, name)}<b>${esc(name)}</b>${x}</div>
    <div class="ch-body" id="chatMsgs" aria-live="polite"></div>
    <div class="ch-foot">
      ${chat.picking ? `<div class="ch-pick"><input class="input" id="chatPickQ" type="search" placeholder="Chercher un film ou une série à conseiller…" autocomplete="off"><div class="ch-hits" id="chatHits"></div></div>` : ""}
      ${chat.attach ? `<div class="ch-chip">${poster(chat.attach, {mini: true})}<span>🎬 ${esc(chat.attach.title)}</span><button class="ch-x" data-chat="rm-attach" aria-label="Retirer le film">×</button></div>` : ""}
      <div class="ch-input">
        <button class="ch-x" data-chat="pick" aria-pressed="${chat.picking}" aria-label="Conseiller un film" title="Conseiller un film">🎬</button>
        <textarea class="input" id="chatTa" rows="1" maxlength="2000" placeholder="Votre message…" aria-label="Message"></textarea>
        <button class="ch-x send" data-chat="send" aria-label="Envoyer">${ICON.send}</button>
      </div>
    </div>`;
  paintChatMsgs();
  const ta = $("#chatTa");
  ta.value = chat.draft;
  ta.oninput = () => { chat.draft = ta.value; ta.style.height = "auto"; ta.style.height = Math.min(120, ta.scrollHeight) + "px"; };
  ta.onkeydown = ev => { if (ev.key === "Enter" && !ev.shiftKey) { ev.preventDefault(); sendChat(); } };
  if (chat.picking) { const q = $("#chatPickQ"); q.oninput = () => chatSearch(q.value); q.focus(); paintChatHits(); }
  else ta.focus({preventScroll: true});
}
async function chatSearch(query) {
  const my = ++chat.pickToken, q = query.trim();
  if (!q) { chat.hits = []; paintChatHits(); return; }
  await new Promise(r => setTimeout(r, 250));
  if (my !== chat.pickToken) return;
  try {
    const res = await tmdb("/search/multi", {query: q, include_adult: "false"});
    if (my !== chat.pickToken) return;
    chat.hits = res.results.map(r => fromTmdb(r)).filter(f => f && f.title).slice(0, 6);
  } catch { chat.hits = []; }
  paintChatHits();
}
function paintChatHits() {
  const el = $("#chatHits"); if (!el) return;
  el.innerHTML = chat.hits.map((f, i) => `<button class="ch-hit" data-chat-hit="${i}">${filmLine(f)}</button>`).join("");
}
async function sendChat() {
  const ta = $("#chatTa"), body = (ta?.value || "").trim(), t = chat.attach, peer = chat.peer;
  if (!peer || (!body && !t)) return;
  ta.value = ""; chat.draft = ""; chat.attach = null;
  const {data, error} = await auth.sb.from("messages").insert({sender: myId(), recipient: peer, body, title: t ? slimTitle(t) : null}).select().single();
  if (error) { toast("Le message n'a pas pu être envoyé."); chat.draft = body; chat.attach = t; if (chat.peer === peer) renderChat(); return; }
  chat.msgs.push(data);
  if (chat.open && chat.peer === peer) { if (t) renderChat(); else paintChatMsgs(); }
}
// Bulle déplaçable : on la maintient et on la fait glisser où l'on veut ; la fenêtre s'ouvre ensuite à côté d'elle
const CHAT_POS_KEY = "filmory:chatpos";
let fabDragged = false;
function placeFab(x, y) {
  const fab = $("#chatFab"), w = fab.offsetWidth || 60, h = fab.offsetHeight || 60, m = 8;
  x = Math.min(Math.max(m, x), innerWidth - w - m); y = Math.min(Math.max(m, y), innerHeight - h - m);
  Object.assign(fab.style, {left: x + "px", top: y + "px", right: "auto", bottom: "auto"});
  placeChatPanel();
}
function placeChatPanel() {
  const fab = $("#chatFab"), s = $("#chatPanel").style;
  if (!fab.style.left) return; // jamais déplacée : position du CSS
  const f = fab.getBoundingClientRect(), m = 12;
  const right = f.left + f.width / 2 > innerWidth / 2, below = f.top + f.height / 2 > innerHeight / 2;
  s.left = s.right = s.top = s.bottom = "auto";
  if (right) s.right = Math.max(m, innerWidth - f.right) + "px"; else s.left = Math.max(m, f.left) + "px";
  if (below) s.bottom = innerHeight - f.top + 10 + "px"; else s.top = f.bottom + 10 + "px";
  s.height = `min(560px, ${Math.max(260, (below ? f.top - 10 : innerHeight - f.bottom - 10) - m)}px)`;
  s.transformOrigin = `${below ? "bottom" : "top"} ${right ? "right" : "left"}`;
}
// coin de la fenêtre le plus proche de la bulle (point de départ des animations)
function chatOrigin(p) {
  const o = $("#chatPanel").style.transformOrigin || "bottom right";
  return {x: o.includes("left") ? p.left : p.right, y: o.includes("top") ? p.top : p.bottom};
}
function restoreFab() {
  let pos; try { pos = JSON.parse(localStorage.getItem(CHAT_POS_KEY)); } catch {}
  if (!pos) return;
  const fab = $("#chatFab"), w = fab.offsetWidth || 60, h = fab.offsetHeight || 60;
  placeFab(pos.fx * (innerWidth - w), pos.fy * (innerHeight - h));
}
(() => {
  const fab = $("#chatFab"); let st = null;
  fab.addEventListener("pointerdown", ev => {
    if (ev.button) return;
    const r = fab.getBoundingClientRect();
    fabDragged = false;
    st = {x: ev.clientX, y: ev.clientY, ox: r.left, oy: r.top, id: ev.pointerId, moved: false};
  });
  fab.addEventListener("pointermove", ev => {
    if (!st) return;
    const dx = ev.clientX - st.x, dy = ev.clientY - st.y;
    if (!st.moved) { if (Math.hypot(dx, dy) < 6) return; st.moved = true; fab.setPointerCapture(st.id); fab.classList.add("dragging"); }
    placeFab(st.ox + dx, st.oy + dy);
  });
  const end = () => {
    if (!st) return;
    if (st.moved) {
      fabDragged = true; fab.classList.remove("dragging");
      const r = fab.getBoundingClientRect();
      try { localStorage.setItem(CHAT_POS_KEY, JSON.stringify({fx: r.left / Math.max(1, innerWidth - r.width), fy: r.top / Math.max(1, innerHeight - r.height)})); } catch {}
    }
    st = null;
  };
  fab.addEventListener("pointerup", end); fab.addEventListener("pointercancel", end);
  fab.addEventListener("dblclick", () => { // double-clic : retour à sa place d'origine
    try { localStorage.removeItem(CHAT_POS_KEY); } catch {}
    fab.removeAttribute("style"); $("#chatPanel").removeAttribute("style");
  });
  addEventListener("resize", restoreFab);
  restoreFab();
})();
$("#chatFab").onclick = () => { if (fabDragged) { fabDragged = false; return; } chat.open ? closeChat() : openChat(chat.peer); };
$("#chatPanel").addEventListener("click", ev => {
  const hit = ev.target.closest("[data-chat-hit]");
  if (hit) { chat.attach = chat.hits[+hit.dataset.chatHit]; chat.picking = false; renderChat(); return; }
  const p = ev.target.closest("[data-peer]"); if (p) { openChat(p.dataset.peer); return; }
  const b = ev.target.closest("[data-chat]"); if (!b) return;
  const act = b.dataset.chat;
  if (act === "close") closeChat();
  else if (act === "back") { chat.peer = null; chat.picking = false; renderChat(); }
  else if (act === "send") sendChat();
  else if (act === "pick") { chat.picking = !chat.picking; chat.hits = []; renderChat(); }
  else if (act === "rm-attach") { chat.attach = null; renderChat(); }
});
$("#chatPanel").addEventListener("keydown", ev => { if (ev.key === "Escape") { closeChat(); $("#chatFab").focus(); } });

/* ----- Admin (créateur uniquement) ----- */
const adm = {q: "", hits: null, token: 0, timer: null, stats: null, revs: null, armed: "", at: 0};
async function loadAdmin() {
  adm.at = Date.now();
  const count = t => auth.sb.from(t).select("*", {count: "exact", head: true}).then(r => r.error ? "–" : r.count ?? 0);
  const [members, reviews, players, revs] = await Promise.all([count("public_profiles"), count("reviews"), count("quiz_scores"),
    auth.sb.from("reviews").select("user_id,title_id,title,author,text,updated_at").order("updated_at", {ascending: false}).limit(25)]);
  adm.stats = {members, reviews, players};
  adm.revs = revs.data || [];
  adm.revs.forEach(r => r.title && registerTitles([r.title]));
  if (ui.view === "admin") viewAdmin();
}
async function admSearch(q) {
  const my = ++adm.token;
  try {
    const res = q.trim() ? await tmdb("/search/multi", {query: q.trim(), include_adult: "false"}) : await tmdb("/trending/all/week");
    if (my !== adm.token) return;
    adm.hits = res.results.map(r => fromTmdb(r)).filter(f => f && f.title).slice(0, 18);
  } catch { if (my === adm.token) adm.hits = []; }
  const el = $("#admHits"); if (el && ui.view === "admin") el.innerHTML = admHitsHTML();
}
function admHitsHTML() {
  if (!adm.hits) return `<p class="muted">Chargement…</p>`;
  if (!adm.hits.length) return `<p class="muted">Aucun résultat sur TMDB.</p>`;
  return `<div class="adm-hits">${adm.hits.map(f => { const r = reco.ids.includes(f.id), u = reco.featured.includes(f.id);
    return `<div class="adm-hit">${cardHTML(f, [f.year, kindLabel(f.t)].filter(Boolean).join(" · "))}
      <button class="btn ${r ? "primary" : ""}" data-adm="reco" data-id="${esc(f.id)}" aria-pressed="${r}">${r ? "★ Recommandé" : "☆ Recommander"}</button>
      <button class="btn ${u ? "primary" : ""}" data-adm="feat" data-id="${esc(f.id)}" aria-pressed="${u}">${u ? "✓ À la une" : "Mettre à la une"}</button></div>`; }).join("")}</div>`;
}
function admList(key) {
  const ids = key === "feat" ? reco.featured : reco.ids, list = ids.map(byId).filter(Boolean);
  if (!list.length) return `<p class="muted" style="margin:0">Vide pour l'instant. Ajoutez des titres avec la recherche plus bas.</p>`;
  return list.map((f, i) => `<div class="adm-row"><button class="card" data-open="${esc(f.id)}" aria-label="${esc(f.title)}">${poster(f, {mini: true})}</button>
    <span style="min-width:0"><b>${esc(f.title)}</b><small>${[f.year, kindLabel(f.t)].filter(Boolean).join(" · ")}</small></span>
    <span class="adm-btns"><button class="btn small" data-adm="up" data-key="${key}" data-id="${esc(f.id)}" ${i ? "" : "disabled"} aria-label="Monter">↑</button><button class="btn small" data-adm="down" data-key="${key}" data-id="${esc(f.id)}" ${i < list.length - 1 ? "" : "disabled"} aria-label="Descendre">↓</button><button class="btn small danger" data-adm="rm" data-key="${key}" data-id="${esc(f.id)}" aria-label="Retirer">✕</button></span></div>`).join("");
}
function admRevsHTML() {
  if (!adm.revs) return `<p class="muted" style="margin:0">Chargement…</p>`;
  if (!adm.revs.length) return `<p class="muted" style="margin:0">Aucune critique publiée pour l'instant.</p>`;
  return adm.revs.map(r => { const k = r.user_id + "|" + r.title_id, f = byId(r.title_id);
    return `<div class="adm-rev"><span style="min-width:0"><b>${esc(r.author?.name || "Cinéphile")}</b> <small>sur ${f ? `<button class="linkish" data-open="${esc(f.id)}">${esc(f.title)}</button>` : esc(r.title_id)} · ${ago(r.updated_at)}</small><p>${esc(r.text)}</p></span>
      <button class="btn small ${adm.armed === k ? "primary" : "ghost"} danger" data-adm="del-rev" data-id="${esc(k)}">${adm.armed === k ? "Confirmer" : "Supprimer"}</button></div>`; }).join("");
}
function viewAdmin() {
  if (!auth.admin) {
    $("#main").innerHTML = `<div class="narrow"><div class="view-head"><div><h1>Admin</h1></div></div><div class="empty"><h3>Accès réservé</h3><p>Cette page est réservée au créateur de Filmory.</p><a class="btn primary" href="#accueil">Retour à l'accueil</a></div></div>`;
    return;
  }
  if (!adm.at || Date.now() - adm.at > 60000) loadAdmin();
  if (!adm.hits) admSearch(adm.q);
  const tile = (l, v) => `<div class="sp-tile"><span>${l}</span><b class="num">${v ?? "…"}</b></div>`;
  $("#main").innerHTML = `<div class="narrow">
    <div class="view-head"><div><div class="eyebrow">Créateur</div><h1>Admin</h1></div></div>
    <div class="sp-tiles" style="margin-bottom:22px">${tile("Membres", adm.stats?.members)}${tile("Critiques publiées", adm.stats?.reviews)}${tile("Joueurs du quiz", adm.stats?.players)}${tile("Recommandations", reco.ids.length)}</div>
    <div class="adm-grid">
      <section class="adm-card"><h2>Nos recommandations · ${reco.ids.length}</h2><p class="note" style="margin:0">Affichées sur l'accueil pour tout le monde, dans cet ordre.</p>${admList("reco")}</section>
      <section class="adm-card"><h2>À la une · ${reco.featured.length}</h2><p class="note" style="margin:0">Passent en premier dans le grand bandeau d'affiches de l'accueil (7 au plus sont visibles).</p>${admList("feat")}</section>
    </div>
    <h2 class="sec-title">${ICON.film} Ajouter des films et des séries</h2>
    <label class="hsearch" style="width:min(560px,100%);margin-bottom:18px"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="admQ" type="search" placeholder="Chercher sur TMDB (vide : tendances de la semaine)" aria-label="Chercher un film ou une série" value="${esc(adm.q)}" autocomplete="off"></label>
    <div id="admHits">${admHitsHTML()}</div>
    <h2 class="sec-title">${ICON.pen} Modération des critiques</h2>
    <section class="adm-card">${admRevsHTML()}</section>
  </div>`;
  $("#admQ").oninput = ev => { adm.q = ev.target.value; clearTimeout(adm.timer); adm.timer = setTimeout(() => admSearch(adm.q), 300); };
}
function saveReco() {
  if (!reco.remote || !reco.canEdit) return;
  reco.ref.set({ids: reco.ids, featured: reco.featured}).catch(() => toast("La sélection n'a pas pu être enregistrée."));
}
document.addEventListener("click", async ev => {
  const b = ev.target.closest("[data-adm]"); if (!b || !auth.admin) return;
  const act = b.dataset.adm, id = b.dataset.id, key = b.dataset.key === "feat" ? "featured" : "ids";
  if (act === "del-rev") {
    if (adm.armed !== id) { adm.armed = id; viewAdmin(); return; }
    adm.armed = "";
    const [user_id, title_id] = id.split("|");
    const {error} = await auth.sb.from("reviews").delete().match({user_id, title_id});
    if (error) { toast("Suppression impossible : " + error.message); return; }
    adm.revs = adm.revs.filter(r => r.user_id + "|" + r.title_id !== id); cr.topAt = 0; delete cr.byTitle[title_id];
    toast("Critique supprimée"); viewAdmin(); return;
  }
  if (!reco.remote) { toast("Les recommandations ne sont pas encore chargées."); return; }
  if (act === "reco" || act === "feat") {
    const k = act === "feat" ? "featured" : "ids", on = !reco[k].includes(id);
    reco[k] = on ? (k === "ids" ? [id, ...reco[k]] : [...reco[k], id]) : reco[k].filter(x => x !== id);
    toast(on ? (k === "ids" ? "Ajouté aux recommandations" : "Mis à la une") : (k === "ids" ? "Retiré des recommandations" : "Retiré de la une"));
  } else if (act === "rm") reco[key] = reco[key].filter(x => x !== id);
  else if (act === "up" || act === "down") {
    const list = reco[key].slice(), i = list.indexOf(id), j = i + (act === "up" ? -1 : 1);
    if (i < 0 || j < 0 || j >= list.length) return;
    [list[i], list[j]] = [list[j], list[i]]; reco[key] = list;
  }
  saveReco(); viewAdmin();
});

readLocal();
renderAll();
initAuth();
