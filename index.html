<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e0e11">
<meta name="description" content="Filmory : notez vos films et séries, écrivez vos critiques, tenez votre journal et votre collection.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><title>Filmory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap">
<style>
/* Layout: DA type plateforme de streaming — en-tête posé sur un bandeau d'affiches inclinées, rangées horizontales, accent blanc. Thème sombre unique, choisi délibérément. */
:root{
  --bg:#0e0e11; --bg-2:#121216; --surface:#17171c; --surface-2:#212127; --line:#2d2d35;
  --fg:#f4f4f6; --muted:#9a9aa4; --accent:#ffffff; --accent-2:#ffffff; --accent-ink:#0e0e11; --accent-hover:#d9d9df; --glow:rgba(255,255,255,.18);
  --heart:#f472b6; --seen:#4ade80; --danger:#f87171; --star:#fbbf24;
  --f:"Nunito",ui-rounded,"Segoe UI",system-ui,sans-serif;
  --r:10px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
:root{padding-top:0}
body{margin:0;min-height:100dvh}
img{max-width:100%}
[hidden]{display:none!important}
.yt{position:relative;width:100%;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:#000;box-shadow:0 0 0 1px #222}
.yt iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.foot{max-width:1200px;margin:0 auto;padding:30px 16px calc(40px + env(safe-area-inset-bottom,0px));color:var(--muted);font-size:12.5px;font-weight:600;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line)}
.foot a{color:var(--fg)}
body{background:var(--bg);color:var(--fg);font-family:var(--f);font-size:15px;line-height:1.5;font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}
h1,h2,h3{font-weight:900;line-height:1.1;margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- header ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:linear-gradient(180deg,rgba(8,8,12,.85),rgba(8,8,12,0));transition:background .25s}
.top.solid{background:rgba(14,14,19,.94);backdrop-filter:blur(10px);box-shadow:0 1px 0 var(--line)}
.top-in{padding:10px 16px;display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none}
.logo svg{width:26px;height:26px;fill:var(--accent)}
.logo b{font-size:26px;font-weight:900;color:var(--fg);letter-spacing:-.01em}
nav.tabs{display:flex;gap:4px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
nav.tabs a{padding:6px 12px;text-decoration:none;color:var(--fg);font-weight:700;font-size:15px;white-space:nowrap;border-radius:6px;text-shadow:0 1px 6px rgba(0,0,0,.6)}
nav.tabs a:hover{color:var(--muted)}
nav.tabs a[aria-current="page"]{color:var(--fg);box-shadow:inset 0 -2px 0 var(--fg);border-radius:0}
.hsearch{display:flex;align-items:center;gap:8px;background:rgba(32,32,43,.85);border:1px solid var(--line);border-radius:999px;padding:7px 14px;width:min(260px,100%)}
.hsearch input{border:0;background:none;outline:none;width:100%;min-width:0;font-weight:600}
.hsearch input::placeholder{color:var(--muted)}
.hsearch svg{color:var(--muted);width:17px;height:17px}
.me-btn{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:5px 14px 5px 5px;font-weight:800;font-size:14px}
.me-btn .av{width:28px;height:28px;border-radius:6px;background:rgba(0,0,0,.12);display:grid;place-items:center;overflow:hidden;font-size:12px}
.me-btn .av img{width:100%;height:100%;object-fit:cover}
.me-btn:hover{background:var(--accent-hover)}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync[data-s="synced"]::before{background:var(--seen)}
.sync[data-s="saving"]::before{background:var(--star)}
.sync[data-s="error"]::before{background:var(--danger)}
@media (max-width:760px){
  .top,.top.solid{background:rgba(14,14,19,.97);backdrop-filter:blur(10px);box-shadow:0 1px 0 var(--line)}
  .top-in{gap:8px 12px;padding:8px 16px 10px}
  .logo{flex:1}
  .logo b{font-size:23px}
  nav.tabs{order:4;flex-basis:100%;margin:0 -16px;padding:0 10px}
  nav.tabs a{padding:6px 10px;font-size:14px}
  .hsearch{order:5;width:100%}
  .sync{display:none}
  .me-btn span:last-child{display:none}
  .me-btn{padding:5px}
  .hero{margin-top:0}
  .hero-track{grid-auto-columns:minmax(200px,62vw);height:min(430px,78vw * 1.4)}
  .bubble{right:-4px;width:min(270px,calc(100vw - 24px))}
}

main{padding:24px 16px 80px}
.narrow{max-width:1200px;margin-inline:auto}
.view-head{display:flex;align-items:end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.view-head h1{font-size:clamp(32px,5vw,44px)}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-2)}

/* ---------- hero ---------- */
main.home{padding-top:0}
.hero{margin:-62px -16px 0;position:relative}
.hero-track{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:14px;height:clamp(340px,40vw,460px);overflow-x:auto;scrollbar-width:none;padding:0 6px}
.hp{position:relative;border:0;padding:0;background:var(--surface);overflow:hidden;clip-path:polygon(0 0,100% 0,100% 100%,0 95%)}
.hp:nth-child(even){clip-path:polygon(0 0,100% 0,100% 95%,0 100%)}

.hp img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s ease,filter .4s}
.hp::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35) 0,transparent 25%,transparent 45%,rgba(8,8,10,.85));opacity:0;transition:opacity .35s}
.hp-info{position:absolute;inset:auto 14px 18%;display:grid;justify-items:center;gap:14px;z-index:1;opacity:0;transform:translateY(8px);transition:opacity .35s,transform .35s;text-align:center}
.hp-title{font-size:21px;font-weight:900;text-shadow:0 2px 10px rgba(0,0,0,.8);line-height:1.25}
.hp-meta{font-size:13px;color:#e6e6ea;margin-top:-8px}
.hp.on::after,.hp.on .hp-info{opacity:1;transform:none}
.hp.on img{transform:scale(1.04)}
.hero-badge{position:absolute;left:22px;bottom:32px;z-index:2;background:rgba(14,14,19,.8);border:1px solid var(--line);padding:6px 12px;border-radius:999px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-2);pointer-events:none}
.dots{display:flex;justify-content:center;gap:6px;margin-top:10px}
.dots button{width:8px;height:8px;border-radius:999px;border:0;background:var(--line);padding:0;transition:width .3s}
.dots button[aria-current="true"]{width:22px;background:var(--fg)}
@media (prefers-reduced-motion:reduce){.hp img,.hp::after,.hp-info,.dots button{transition:none}}

/* ---------- sections & rows ---------- */
.sec-title{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:900;margin:38px 0 16px}
.sec-title svg{color:var(--accent);width:24px;height:24px}
.sec-title .more{margin-left:auto;font-size:14px;font-weight:700;color:var(--accent-2);text-decoration:none}
.row{display:grid;grid-auto-flow:column;grid-auto-columns:168px;gap:16px;overflow-x:auto;padding:14px 120px 12px 8px;margin:-14px 0 0 -8px;scroll-snap-type:x proximity;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.row > *{scroll-snap-align:start}
.row-empty{color:var(--muted);padding:18px 0;display:flex;gap:12px;align-items:center;flex-wrap:wrap}

/* calendar */
.cal{max-width:1260px;margin-inline:auto}
.cal-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.day{background:linear-gradient(180deg,var(--surface-2),var(--surface));border-radius:var(--r);overflow:hidden;border:2px solid transparent;display:flex;flex-direction:column}
.day.on{border-color:var(--accent)}
.day h3{font-size:16px;font-weight:800;padding:12px 14px;background:var(--surface-2)}
.day.on h3{background:var(--accent);color:var(--accent-ink)}
.day h3 small{display:block;font-size:12px;font-weight:700;opacity:.8}
.day ul{list-style:none;margin:0;padding:10px 12px 14px;display:grid;gap:2px;text-align:center}
.day li{font-size:13.5px;color:var(--muted);line-height:1.35;padding:4px}
.day li button{background:none;border:0;padding:0;color:var(--fg);font-weight:700;text-align:center}
.day li button:hover{text-decoration:underline}
.day li small{display:block;font-size:11.5px;color:var(--muted);font-weight:700}
.day li.cal-k{font-size:10.5px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--fg);opacity:.55;padding:8px 0 2px}
.day li.cal-k:first-child{padding-top:0}

/* ---------- posters / cards ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:24px 16px}
.card{display:grid;gap:7px;background:none;border:0;padding:0;text-align:left;min-width:0;align-content:start;position:relative}
.card:hover,.card:focus-visible{z-index:4}
.pwrap{position:relative;display:block;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.pwrap .poster{z-index:1}
.peek{position:absolute;left:50%;top:50%;width:118%;aspect-ratio:1;border-radius:50%;z-index:0;transform:translate(-50%,-50%) rotate(0deg) scale(.82);transition:transform .5s cubic-bezier(.2,.8,.2,1);
  background:conic-gradient(from 20deg,#a7a9b1,#cfd0d6,#8e919b,#c3c5cb,#a29eac,#c9c9ce,#979da1,#a7a9b1);box-shadow:0 10px 24px rgba(0,0,0,.6)}
.peek-label{position:absolute;inset:1.5%;border-radius:50%;background-size:cover;background-position:center;-webkit-mask:radial-gradient(circle closest-side,transparent 0 27.7%,#000 28.3%);mask:radial-gradient(circle closest-side,transparent 0 27.7%,#000 28.3%)}
.peek-label::after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle closest-side,transparent 55%,rgba(0,0,0,.35))}
.peek::before{content:"";position:absolute;inset:0;border-radius:50%;z-index:1;background:radial-gradient(circle closest-side,var(--bg) 0 11.5%,rgba(150,152,160,.8) 12% 13.5%,rgba(170,174,184,.2) 14% 26%,rgba(160,162,170,.6) 26.5% 27.5%,transparent 28%)}
.peek::after{content:"";position:absolute;inset:0;border-radius:50%;z-index:2;background:conic-gradient(from 200deg,transparent 0 20%,rgba(255,255,255,.16) 28%,transparent 36% 70%,rgba(255,255,255,.08) 78%,transparent 86%)}
.card:hover .pwrap,.card:focus-visible .pwrap{transform:scale(1.08)}
.card:hover .peek,.card:focus-visible .peek{transform:translate(-5%,-50%) rotate(140deg) scale(1)}
.poster{container-type:inline-size;position:relative;aspect-ratio:2/3;max-width:100%;width:100%;border-radius:8px;overflow:hidden;color:var(--ink,#fff);background:linear-gradient(160deg,var(--c1),var(--c2));isolation:isolate}
.poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.poster.drawn::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(0,0,0,.5));z-index:-1}
.poster.v1{background:radial-gradient(circle at 50% 34%,var(--c3) 0 24%,transparent 24.5%),linear-gradient(180deg,var(--c1),var(--c2))}
.poster.v2{background:repeating-linear-gradient(180deg,var(--c1) 0 12%,var(--c2) 12% 24%)}
.poster.v3{background:var(--c1)}
.poster.v3::before{content:"";position:absolute;inset:6%;border:1px solid color-mix(in srgb,var(--ink,#fff) 45%,transparent)}
.poster .pt{position:absolute;left:9%;right:9%;bottom:9%;font-weight:900;font-size:13cqi;line-height:1;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;text-wrap:balance}
.poster.v2 .pt{bottom:auto;top:9%}
.poster.v3 .pt{top:50%;bottom:auto;transform:translateY(-50%);text-align:center}
.poster .py{position:absolute;top:7%;left:9%;font-size:8cqi;font-weight:800;opacity:.85}
.poster.v2 .py{top:auto;bottom:7%}
.poster .ptag{position:absolute;top:7%;right:9%;font-size:6.5cqi;font-weight:900;letter-spacing:.1em;padding:1px 5px;border:1px solid currentColor;border-radius:3px;opacity:.85}
.poster .badge{position:absolute;top:6px;left:6px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:900;padding:2px 7px;border-radius:5px;z-index:2}
.poster .mine{position:absolute;left:0;right:0;bottom:0;padding:16px 8px 6px;background:linear-gradient(180deg,transparent,rgba(0,0,0,.85));display:flex;gap:6px;align-items:center;font-size:12.5px;z-index:2}
.card .poster{transition:transform .2s ease,box-shadow .2s}
.card:hover .poster,.card:focus-visible .poster{box-shadow:0 0 0 2px var(--accent),0 14px 30px rgba(0,0,0,.6)}
.card:not(:has(.pwrap)):hover .poster{transform:translateY(-3px)}
.card .ct{font-weight:800;font-size:14px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .cs{font-size:12.5px;color:var(--muted);margin-top:-6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stars-s{color:var(--star);letter-spacing:.03em}
.ic-heart{color:var(--heart)}
.ic-seen{color:var(--seen)}
@media (prefers-reduced-motion:reduce){.card .poster,.pwrap,.peek{transition:none}.card:hover .poster{transform:none}}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);font-weight:800;font-size:14px;text-decoration:none}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{background:var(--accent-hover)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.btn.small{padding:5px 11px;font-size:13px}
.input,select.input,textarea.input{width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg-2);min-width:0;font-weight:600}
textarea.input{resize:vertical;min-height:110px;line-height:1.55}
label.lbl{display:grid;gap:5px;font-size:13px;font-weight:800;color:var(--muted)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 14px;font-size:14px;font-weight:800;color:var(--muted);border-radius:999px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

/* ---------- empty ---------- */
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:32px 24px;display:grid;gap:12px;justify-items:start;max-width:640px}
.empty h3{font-size:24px}
.empty p{margin:0;color:var(--muted);max-width:52ch;font-weight:500}
.row-btns{display:flex;gap:10px;flex-wrap:wrap}

/* ---------- journal ---------- */
.month{margin-bottom:28px}
.month h2{font-size:18px;color:var(--accent-2);padding-bottom:8px;border-bottom:1px solid var(--line);margin-bottom:6px;text-transform:capitalize}
.log{display:grid;grid-template-columns:44px 46px minmax(0,1fr) auto;gap:14px;align-items:center;padding:9px 8px;border-radius:8px;background:none;border:0;width:100%;text-align:left}
.log:hover{background:var(--surface)}
.log .day-n{font-size:26px;font-weight:900;text-align:center;line-height:1}
.log .poster{border-radius:4px}
.log .lt{font-weight:800;min-width:0}
.log .lt small{display:block;color:var(--muted);font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.log .lr{display:flex;gap:8px;align-items:center;justify-content:end}
@media (max-width:520px){.log{grid-template-columns:34px 40px minmax(0,1fr)}.log .lr{grid-column:3;justify-content:start}.log .day-n{font-size:22px}}

/* ---------- reviews ---------- */
.reviews{display:grid;gap:14px;max-width:820px}
.review{display:grid;grid-template-columns:80px minmax(0,1fr);gap:18px;padding:18px;background:var(--surface);border-radius:var(--r);border:1px solid var(--line)}
.review .rh{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.review .rh h3{font-size:20px}
.review .rh .yr{font-size:13px;color:var(--muted)}
.review .rmeta{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--muted);margin:4px 0 10px}
.review .rtext{white-space:pre-wrap;max-width:65ch;margin:0;font-weight:500}
.spoil{position:relative}
.spoil .rtext{filter:blur(6px);user-select:none}
.spoil-btn{position:absolute;inset:0;margin:auto;width:max-content;height:max-content}
.tag-ex{font-size:10px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--muted)}
@media (max-width:520px){.review{grid-template-columns:56px minmax(0,1fr);gap:12px;padding:14px}}

/* ---------- profile ---------- */
.banner{height:190px;border-radius:14px;background:linear-gradient(120deg,var(--b1),var(--b2));position:relative;overflow:hidden}
.banner img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(18px) saturate(1.3);transform:scale(1.2);opacity:.85}
.banner img.custom{filter:none;transform:none;opacity:1}
.bn-crop{position:relative;width:100%;max-width:100%;overflow:hidden;border-radius:10px;border:1px solid var(--line);background:#000;cursor:grab;touch-action:none;user-select:none}
.bn-crop.dragging{cursor:grabbing}
.bn-crop img{position:absolute;left:0;top:0;max-width:none;transform-origin:0 0;pointer-events:none}
.bn-crop::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 0 2px rgba(255,255,255,.5);border-radius:inherit}
.av-crop{position:relative;width:140px;height:140px;flex:none;border-radius:50%;overflow:hidden;background:#000;cursor:grab;touch-action:none;user-select:none;box-shadow:0 0 0 3px #fff}
.av-crop.dragging{cursor:grabbing}
.av-crop img{position:absolute;left:0;top:0;max-width:none;transform-origin:0 0;pointer-events:none}
.bn-ctrls{display:grid;grid-template-columns:1fr 1fr auto;gap:14px;align-items:end}
.bn-ctrls input[type=range]{width:100%;accent-color:#fff}
@media (max-width:560px){.bn-ctrls{grid-template-columns:1fr}}
.banner::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,rgba(14,14,19,.7))}
.pf-head{display:flex;gap:20px;align-items:end;margin-top:-58px;padding:0 20px;flex-wrap:wrap;position:relative}
.avatar{width:120px;height:120px;border-radius:50%;border:4px solid var(--bg);background:var(--surface-2);display:grid;place-items:center;font-size:44px;font-weight:900;overflow:hidden;flex:none;box-shadow:0 0 0 3px var(--accent)}
.avatar img{width:100%;height:100%;object-fit:cover}
.pf-id{flex:1;min-width:200px;padding-bottom:6px}
.pf-id h1{font-size:clamp(30px,5vw,42px)}
.pf-id .handle{color:var(--accent-2);font-size:15px;font-weight:800}
.pf-bio{max-width:62ch;margin:16px 20px 0;white-space:pre-wrap;font-weight:500}
.stats{display:flex;gap:30px;flex-wrap:wrap;margin:22px 20px 0;padding-top:16px;border-top:1px solid var(--line)}
.stat b{display:block;font-size:32px;line-height:1;font-weight:900}
.stat span{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800}
.pf-grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:40px;margin-top:20px}
@media (max-width:860px){.pf-grid{grid-template-columns:minmax(0,1fr)}}
.pf-grid .sec-title{font-size:18px;margin:26px 0 14px}
.fav4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}

.spark{position:absolute;left:50%;top:50%;width:5px;height:5px;margin:-2.5px;background:#fff;border-radius:1px;box-shadow:0 0 6px #fff}
.ic-dis{color:var(--muted)}
.disc-enter{position:absolute;left:50%;top:50%;width:27%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;border:0;background:transparent;padding:0;cursor:zoom-in;display:grid;place-items:center}
.disc-enter::before{content:"";position:absolute;inset:-3%;border-radius:50%;border:1.5px solid rgba(255,255,255,.5);opacity:0;transition:opacity .25s,transform .25s}
.disc-enter:hover::before,.disc-enter:focus-visible::before{opacity:1;transform:scale(1.06)}
.disc-enter .tri{width:24%;aspect-ratio:1;opacity:0;transition:opacity .25s;fill:#fff}
.disc-enter:hover .tri,.disc-enter:focus-visible .tri{opacity:.9}
.disc-enter.has::after{content:"";position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 0 rgba(255,255,255,.45);animation:holePulse 2.6s 2s infinite}
@keyframes holePulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.4)}70%,100%{box-shadow:0 0 0 14px rgba(255,255,255,0)}}
#dlgDetail.diving{overflow:visible}
#dlgDetail.diving .dlg-close{opacity:0;pointer-events:none}
.tunnel{position:fixed;inset:0;z-index:15;pointer-events:none;overflow:hidden}
.tunnel .iris{position:absolute;border-radius:50%;background:#050506;box-shadow:0 0 0 1.5px rgba(160,162,170,.6),0 0 40px 10px rgba(0,0,0,.6) inset}
.tunnel .ring{position:absolute;left:50%;top:50%;width:40px;height:40px;margin:-20px;border-radius:50%;border:1.5px solid rgba(255,255,255,.55);opacity:0}
.theater{position:fixed;inset:0;z-index:20;background:#000;display:grid;place-items:center;padding:56px 16px 24px;overflow:auto}
.theater-in{width:min(1100px,100%);display:grid;gap:14px}
.theater h2{font-size:clamp(20px,3vw,30px);color:#fff}
.theater .t-sub{color:#a3a3ad;font-size:14px;font-weight:700}
.theater video{width:100%;aspect-ratio:16/9;max-width:100%;background:#000;border-radius:10px;box-shadow:0 0 0 1px #222,0 30px 80px rgba(255,255,255,.06)}
.theater .t-back{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:14px;z-index:2;background:rgba(30,30,36,.9);color:#fff;border:1px solid #333}
.theater .t-none{aspect-ratio:16/9;border-radius:10px;display:grid;place-items:center;text-align:center;padding:24px;background-size:cover;background-position:center;position:relative;overflow:hidden}
.theater .t-none::before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(14px)}
.theater .t-none > div{position:relative;display:grid;gap:12px;justify-items:center;color:#fff}
.booklet{max-width:820px;margin:22px auto 0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;gap:16px}
.credits{display:grid;gap:10px}
/* clap de cinéma (crédits + critique) */
.booklet.clap{background:none;border:0;padding:0;gap:0;max-width:820px;margin-top:clamp(64px,13vw,130px)}
.clap{--chalk:rgba(255,255,255,.88);--slate:#0a0a0c;filter:drop-shadow(0 22px 40px rgba(0,0,0,.55))}
.clap-sticks{position:relative;height:74px}
.stick{position:absolute;left:0;right:0;height:36px;border-radius:4px;background:repeating-linear-gradient(115deg,#c9c9ce 0 34px,#08080a 34px 68px);box-shadow:inset 0 0 0 2px #08080a,inset 0 -3px 0 rgba(0,0,0,.25)}
.stick.bottom{bottom:0;border-radius:4px 4px 0 0;background:repeating-linear-gradient(65deg,#c9c9ce 0 34px,#08080a 34px 68px)}
.stick.top{top:4px;transform-origin:20px 50%;transform:rotate(-4deg)}
.stick.top i{position:absolute;left:10px;top:50%;width:14px;height:14px;margin-top:-7px;border-radius:50%;background:radial-gradient(circle,#ddd 0 35%,#888 40% 100%);box-shadow:0 0 0 2px #08080a}
.slate{background:var(--slate);background-image:radial-gradient(ellipse at 20% 10%,rgba(255,255,255,.025),transparent 55%),radial-gradient(ellipse at 85% 90%,rgba(255,255,255,.018),transparent 50%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);border-radius:0 0 10px 10px;padding:6px 22px 18px;color:#fff}
.sl-row{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:2px solid var(--chalk);flex-wrap:wrap}
.sl-k{font-size:13px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:#fff;flex:none}
.sl-head{border-bottom-width:2px;align-items:baseline}
.sl-head .sl-k{font-size:clamp(22px,4vw,34px);letter-spacing:.02em}
.sl-title{font-size:clamp(18px,3vw,26px);font-weight:900;min-width:0;overflow-wrap:anywhere}
.sl-v{min-width:0;flex:1}
.sl-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) minmax(0,.8fr);border-bottom:2px solid var(--chalk)}
.sl-cell{padding:12px 14px 16px;display:grid;gap:10px;align-content:start;justify-items:center;text-align:center}
.sl-cell + .sl-cell{border-left:2px solid var(--chalk)}
.sl-cell:first-child{padding-left:0}
.sl-cell .sl-k{font-size:clamp(14px,2.2vw,19px)}
.sl-note{font-size:22px;font-weight:900}
.sl-note .stars-s{font-size:22px}
.slate .pchip{background:transparent;border-color:rgba(255,255,255,.35);color:#fff}
.slate .pchip[aria-pressed="true"]{border-color:var(--heart);color:var(--heart)}
.slate .input.sl-in{background:transparent;border:1.5px solid rgba(255,255,255,.35);color:#fff;max-width:180px;text-align:center}
.sl-review{display:grid;gap:10px;align-items:stretch}
.slate textarea.sl-ta{background:rgba(255,255,255,.04);border:1.5px dashed rgba(255,255,255,.35);color:#fff;font-size:15px}
.slate textarea.sl-ta::placeholder{color:rgba(255,255,255,.45)}
.slate .check{color:#e8e8ec}
.sl-foot{border-bottom:0;padding-bottom:0}
.sl-foot .sl-k{padding-right:14px;border-right:2px solid var(--chalk)}
@media (max-width:640px){.sl-grid{grid-template-columns:minmax(0,1fr)}.sl-cell{padding-left:0;justify-items:start;text-align:left}.sl-cell + .sl-cell{border-left:0;border-top:2px solid var(--chalk)}.stick{background-size:auto}}
@keyframes clapIt{0%{transform:rotate(-4deg)}35%{transform:rotate(-11deg)}52%{transform:rotate(0deg)}62%{transform:rotate(-1.5deg)}72%{transform:rotate(0deg)}100%{transform:rotate(-4deg)}}
.stage .clap .stick.top{animation:clapIt .9s 1.75s cubic-bezier(.3,.6,.3,1) both}
.stage.static .clap .stick.top{animation:none}
@media (prefers-reduced-motion:reduce){.stage .clap .stick.top{animation:none}}
@media (max-width:720px){
  .dvd{flex-direction:column}
  .case{width:min(170px,44vw)}
  .disc{--d:min(360px,94vw);--dx:0px;--dy:calc(-1 * (var(--d) / 2 + 80px));--s0:.45;margin-left:0;margin-top:-36px}
}
@keyframes caseIn{from{opacity:0;transform:translateY(18px) scale(.94)}}
@keyframes caseTilt{0%,100%{transform:none}40%{transform:rotateY(16deg)}}
@keyframes discOut{0%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(-420deg) scale(var(--s0))}12%{opacity:1}100%{transform:none}}
@keyframes discBack{to{transform:translate(var(--dx),var(--dy)) rotate(-300deg) scale(var(--s0))}}
@keyframes fadeIn{from{opacity:0}}
@keyframes fadeOut{to{opacity:0}}
@keyframes bookIn{from{opacity:0;transform:translateY(20px)}}
@keyframes caseOut{to{opacity:0;transform:scale(.94)}}
.stage .case{animation:caseIn .35s ease-out both,caseTilt .9s .35s ease-in-out}
.stage .disc{animation:discOut 1s .35s cubic-bezier(.2,.7,.2,1) both}
.stage .disc-info{animation:fadeIn .4s 1.2s both}
.stage .booklet{animation:bookIn .45s 1.3s both}
.stage.static *{animation:none}
.stage.closing .disc-info,.stage.closing .booklet{animation:fadeOut .15s both}
.stage.closing .disc{animation:discBack .42s ease-in both}
.stage.closing .case{animation:caseOut .25s .3s both}
@media (prefers-reduced-motion:reduce){.stage *{animation:none!important}}
.pill-now{display:inline-block;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:5px;margin-left:6px;vertical-align:middle}
.credits{display:grid;gap:10px;margin-top:16px}
.credits .cl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;display:block;font-weight:900}
.pchip{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;border:1px solid var(--line);background:var(--bg-2);font-size:13.5px;font-weight:700;margin:0 4px 4px 0}
.pchip[aria-pressed="true"]{border-color:var(--heart);color:var(--heart)}
.panel{background:var(--bg-2);border-radius:var(--r);padding:16px;display:grid;gap:12px;border:1px solid var(--line)}
.rate-row{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.star-input{display:inline-flex;gap:2px;font-size:38px;line-height:1;cursor:pointer;user-select:none;touch-action:manipulation;border-radius:6px}
.star-input span{background:linear-gradient(90deg,var(--star) var(--f,0%),var(--line) var(--f,0%));-webkit-background-clip:text;background-clip:text;color:transparent}
.rate-val{font-size:14px;color:var(--muted);min-width:7ch;font-variant-numeric:tabular-nums}
.check{display:flex;gap:8px;align-items:center;font-size:14px}
.check input{accent-color:var(--accent)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.form-grid .full{grid-column:1/-1}
@media (max-width:560px){.form-grid{grid-template-columns:minmax(0,1fr)}}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid transparent;padding:0}
.sw[aria-pressed="true"]{border-color:var(--fg);box-shadow:0 0 0 2px var(--surface) inset}
.note{font-size:13px;color:var(--muted);font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);padding:10px 18px;border-radius:999px;font-weight:800;font-size:14px;z-index:50;max-width:calc(100vw - 32px);box-shadow:0 8px 30px var(--glow)}

/* ---------- notifications ---------- */
.nt-wrap{position:relative;display:inline-flex}
.icon-btn{position:relative;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:rgba(32,32,43,.85);display:grid;place-items:center;color:var(--fg);padding:0}
.icon-btn:hover{border-color:var(--muted)}
.nt-dot{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--danger);color:#fff;font-size:11px;font-weight:900;display:grid;place-items:center;line-height:1;box-shadow:0 0 0 2px var(--bg)}
.nt-panel{width:340px;max-height:min(70dvh,520px);overflow:auto;padding:6px;align-content:start}

@media (max-width:760px){.nt-panel{right:-50px;width:min(340px,calc(100vw - 24px))}.nt-panel::before{right:63px}}

/* ---------- critiques de la communauté ---------- */
.br-layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:34px;align-items:start;max-width:1400px}
.side-rev{position:sticky;top:76px;max-height:calc(100dvh - 92px);overflow:auto;scrollbar-width:thin;scrollbar-color:var(--line) transparent;background:var(--bg-2);border:1px solid var(--line);border-radius:14px;padding:4px 14px 14px}
.side-rev .sec-title{font-size:17px;margin:12px 0}
.side-rev .sec-title svg{width:20px;height:20px}
.crevs{display:grid;gap:12px}
.crev{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:8px;position:relative;min-width:0}
.crev-film{display:flex;gap:10px;align-items:center;background:none;border:0;padding:0;text-align:left;color:var(--fg);min-width:0}
.crev-film .poster{width:38px;flex:none;border-radius:4px}
.crev-film b{display:block;font-size:14.5px;line-height:1.2}
.crev-film small{color:var(--muted);font-size:12px}
.crev-film:hover b{text-decoration:underline}
.crev-head{display:flex;gap:10px;align-items:center;min-width:0}
.crev-head .bb-av{width:30px;height:30px;font-size:11px}
.crev-who{min-width:0}
.crev-who b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crev-who small{color:var(--muted);font-size:12px}
.crev-text{font-size:14px;max-width:none}
.side-rev .crev-text{display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.rlike{justify-self:start;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg-2);border-radius:999px;padding:4px 11px;font-size:13px;font-weight:800;color:var(--muted)}
.rlike svg{width:15px;height:15px}
.rlike[aria-pressed="true"]{color:var(--heart);border-color:var(--heart)}

.rlike:not(:disabled):hover{border-color:var(--muted)}
@media (max-width:1000px){
  .br-layout{grid-template-columns:minmax(0,1fr)}
  .side-rev{position:static;max-height:none;order:-1;padding-bottom:10px;margin-bottom:6px}
  .side-rev .crevs{grid-auto-flow:column;grid-auto-columns:minmax(260px,78vw);overflow-x:auto;padding-bottom:6px;align-items:start}
}
.comm{max-width:820px;margin:34px auto 0;color:#fff}
.comm .sec-title{margin:0 0 14px}
.stage .comm{animation:bookIn .45s 1.4s both}
.stage.closing .comm{animation:fadeOut .15s both}

<script>
/* ===================== TMDB ===================== */
// Version site : les appels passent par /api/tmdb (fonction serveur Vercel), le jeton TMDB reste côté serveur.
const STANDALONE = true;
const FEATURES = {social: false}; // votes, amis, support, recommandations : étape 2 (Supabase)
const TMDB_PROXY = "/api/tmdb";
const IMG = (p, size = "w500") => p ? `https://image.tmdb.org/t/p/${size}${p}` : "";
const PURL = new Proxy({}, {get: (_, k) => typeof k === "string" && k.startsWith("/") ? IMG(k) : undefined});
const tmdbCache = new Map();
function tmdb(path, params = {}) {
  const qs = new URLSearchParams({language: "fr-FR", ...params, path}).toString();
  if (!tmdbCache.has(qs)) {
    const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 15000);
    tmdbCache.set(qs, fetch(`${TMDB_PROXY}?${qs}`, {signal: ctl.signal})
      .then(async r => {
        clearTimeout(timer);
        const text = await r.text();
        let data = null; try { data = JSON.parse(text); } catch {}
        if (!r.ok || !data) { const e = new Error(data?.error || data?.status_message || text.slice(0, 120) || `HTTP ${r.status}`); e.status = r.status; throw e; }
        return data;
      })
      .catch(e => { clearTimeout(timer); tmdbCache.delete(qs); throw e; }));
  }
  return tmdbCache.get(qs);
}
// Explique en clair pourquoi TMDB ne répond pas
function tmdbProblem(e) {
  const m = String(e?.message || "");
  if (e?.name === "AbortError") return "TMDB met trop de temps à répondre (plus de 15 secondes). Réessayez dans un instant.";
  if (/TMDB_TOKEN/.test(m)) return "La variable TMDB_TOKEN n'est pas prise en compte par Vercel : ajoutez-la dans Settings → Environment Variables, puis faites Deployments → ⋯ → Redeploy.";
  if (e?.status === 401) return "TMDB refuse le jeton (erreur 401). Dans Vercel, mettez dans TMDB_TOKEN le « Jeton d'accès en lecture à l'API » (le long texte qui commence par eyJ), pas la clé courte, puis redéployez.";
  if (e?.status === 404) return "Le relais /api/tmdb est introuvable (erreur 404). Le dossier api doit être à la racine du dépôt GitHub, à côté de index.html.";
  if (e?.status) return `Erreur ${e.status} : ${m}`;
  return `Connexion impossible : ${m || "erreur inconnue"}`;
}
let homeError = "";
const GENRES = {}, GENRES_M = {}, GENRES_T = {};
const TITLES = {};
const tid = (type, id) => `${type === "tv" ? "tv" : "mv"}-${id}`;
const normT = s => String(s ?? "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "");
function fromTmdb(r, type = r?.media_type) {
  if (!r || (type !== "movie" && type !== "tv")) return null;
  const id = tid(type, r.id), ex = TITLES[id] || state.lib.meta?.[id] || {};
  const date = r.release_date || r.first_air_date || "";
  const f = Object.assign(ex, {
    id, tmdb: r.id, t: type === "tv" ? "serie" : "film",
    title: r.title || r.name || ex.title || "", year: +date.slice(0, 4) || ex.year || "", release: date || ex.release || "",
    img: r.poster_path || ex.img || "", backdrop: r.backdrop_path || ex.backdrop || "",
    genre: ex.genre || GENRES[(r.genre_ids || [])[0]] || r.genres?.[0]?.name || "",
    overview: r.overview || ex.overview || "",
    by: ex.by || [], cast: ex.cast || [], len: ex.len ?? "",
  });
  TITLES[id] = f;
  return f;
}
function applyDetails(f, d) {
  f.genre = d.genres?.[0]?.name || f.genre;
  f.overview = d.overview || f.overview;
  if (f.t === "serie") {
    f.dirs = (d.created_by || []).map(p => ({id: p.id, name: p.name}));
    f.by = f.dirs.map(p => p.name);
    f.cast = (d.aggregate_credits?.cast || d.credits?.cast || []).slice(0, 6).map(p => p.name);
    f.eps = d.number_of_episodes || 0;
    f.epMin = d.episode_run_time?.[0] || d.last_episode_to_air?.runtime || 45;
    f.len = d.number_of_seasons ? `${d.number_of_seasons} saison${d.number_of_seasons > 1 ? "s" : ""}` : "";
    f.platform = d.networks?.[0]?.name || "";
  } else {
    const dirs = (d.credits?.crew || []).filter(p => p.job === "Director");
    f.dirs = dirs.map(p => ({id: p.id, name: p.name}));
    f.by = f.dirs.map(p => p.name);
    f.cast = (d.credits?.cast || []).slice(0, 6).map(p => p.name);
    f.len = d.runtime || "";
  }
  const vids = (d.videos?.results || []).filter(v => v.site === "YouTube");
  const tr = vids.find(v => v.type === "Trailer" && v.iso_639_1 === "fr") || vids.find(v => v.type === "Trailer") || vids.find(v => v.type === "Teaser");
  f.video = tr?.key || "";
  f.full = true;
  TITLES[f.id] = f;
  if (state.lib.meta?.[f.id]) rememberTitle(f.id);
  return f;
}
async function fetchDetails(id) {
  const f = byId(id); if (!f || f.custom || f.full || !f.tmdb) return f;
  const tv = f.t === "serie";
  const d = await tmdb(`/${tv ? "tv" : "movie"}/${f.tmdb}`, {append_to_response: tv ? "aggregate_credits,videos" : "credits,videos", include_video_language: "fr,en,null"});
  return applyDetails(f, d);
}
// Copie légère de chaque titre touché (vu, noté, favori…) : le journal, la collection et les stats marchent sans réseau
function slimTitle(f) {
  const {id, tmdb, t, title, year, release, img, genre, by, dirs, cast, len, eps, epMin, platform, video} = f;
  return {id, tmdb, t, title, year, release, img, genre, by, dirs, cast: (cast || []).slice(0, 6), len, eps, epMin, platform, video, full: !!f.full};
}
function rememberTitle(id) {
  const f = TITLES[id]; if (!f) return;
  state.lib.meta ||= {};
  state.lib.meta[id] = slimTitle(f);
}

let NOW = [], NOW_SERIES = [], CLASSICS = [], SORTIES = [];
let homeState = "idle";
const isoOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
async function loadGenres() {
  if (Object.keys(GENRES).length) return;
  const [gm, gt] = await Promise.all([tmdb("/genre/movie/list"), tmdb("/genre/tv/list")]);
  gm.genres.forEach(g => { GENRES[g.id] = g.name; GENRES_M[g.id] = g.name; });
  gt.genres.forEach(g => { GENRES[g.id] ||= g.name; GENRES_T[g.id] = g.name; });
}
async function loadHome() {
  if (homeState === "loading" || homeState === "ready") return;
  homeState = "loading";
  try {
    await loadGenres();
    const seed = hash(today());
    const [np, tvNow, topM, topT, up] = await Promise.all([
      tmdb("/movie/now_playing", {region: "FR"}), tmdb("/trending/tv/week"),
      tmdb("/movie/top_rated", {page: 1 + seed % 5}), tmdb("/tv/top_rated", {page: 1 + seed % 3}),
      tmdb("/movie/upcoming", {region: "FR"})]);
    NOW = np.results.map(r => fromTmdb(r, "movie")).filter(f => f.img);
    NOW.forEach(f => f.now = true);
    NOW_SERIES = tvNow.results.map(r => fromTmdb(r, "tv")).filter(f => f.img).slice(0, 14);
    NOW_SERIES.forEach(f => f.now = true);
    CLASSICS = [...topM.results.map(r => fromTmdb(r, "movie")), ...topT.results.map(r => fromTmdb(r, "tv"))].filter(f => f && f.img);
    // calendrier : semaines du mercredi au mardi (jour des sorties ciné en France)
    const now = new Date(), wed = new Date(now); wed.setDate(now.getDate() - ((now.getDay() + 4) % 7));
    const weeks = Array.from({length: 5}, (_, i) => { const d = new Date(wed); d.setDate(wed.getDate() + (i - 1) * 7); return isoOf(d); });
    const end = new Date(wed); end.setDate(wed.getDate() + 27);

/* ----- Parcourir (TMDB) ----- */
const browse = {key: "", items: [], page: 0, pages: 1, loading: false, error: false};
let browseTimer = null;
const browseKey = () => JSON.stringify([ui.q.trim(), ui.type, ui.genre, ui.sort]);
async function loadBrowse(more = false) {
  const k = browseKey();
  if (!more && browse.key === k) return;
  if (!more) Object.assign(browse, {key: k, items: [], page: 0, pages: 1, error: false});
  if (browse.loading && more) return;
  browse.loading = true; if (ui.view === "parcourir") viewBrowse();
  const page = browse.page + 1, q = ui.q.trim();
  try {
    await loadGenres();
    let res, type = null;
    const sortMap = {popular: "popularity.desc", recent: null, rated: "vote_average.desc"};
    if (q) res = await tmdb("/search/multi", {query: q, page, include_adult: "false"});
    else if (ui.type === "now") res = {results: [], total_pages: 1};
    else if (ui.type === "film" || ui.type === "serie") {
      type = ui.type === "film" ? "movie" : "tv";
      const p = {page, sort_by: sortMap[ui.sort] || "popularity.desc"};
      if (ui.sort === "recent") { p.sort_by = type === "movie" ? "primary_release_date.desc" : "first_air_date.desc"; p[type === "movie" ? "primary_release_date.lte" : "first_air_date.lte"] = today(); p["vote_count.gte"] = 20; }
      if (ui.sort === "rated") p["vote_count.gte"] = 300;
      if (ui.genre) p.with_genres = ui.genre;
      res = await tmdb(`/discover/${type}`, p);
    } else res = await tmdb("/trending/all/week", {page});
    if (browseKey() !== k) return;
    const items = ui.type === "now" && !q ? [...NOW, ...NOW_SERIES] : res.results.map(r => fromTmdb(r, type || r.media_type)).filter(f => f && f.title);
    browse.items.push(...items.filter(f => !browse.items.includes(f)));
    browse.page = page; browse.pages = Math.min(res.total_pages || 1, 20);
  } catch { browse.error = true; }
  browse.loading = false;
  if (ui.view === "parcourir" && browseKey() === k) viewBrowse();
}
function viewBrowse() {
  const k = browseKey(), q = ui.q.trim();
  if (browse.key !== k) { clearTimeout(browseTimer); browseTimer = setTimeout(() => loadBrowse(), q ? 300 : 0); }
  const fresh = browse.key === k;
  let list = fresh ? browse.items : [];
  if (ui.sort === "unseen") list = list.filter(f => !E(f.id)?.watched);
  if (!q && ui.type === "all" && state.lib.custom.length) list = [...state.lib.custom, ...list];
  const gmap = ui.type === "serie" ? GENRES_T : GENRES_M;
  const genreOk = !q && (ui.type === "film" || ui.type === "serie");
  const side = !auth.ready || auth.sb;
  $("#main").innerHTML = `<div class="narrow ${side ? "br-layout" : ""}"><div class="br-main">
    <div class="view-head"><div><div class="eyebrow">Catalogue TMDB</div><h1>${q ? `Résultats pour « ${esc(ui.q)} »` : "Films &amp; séries"}</h1></div>
      <button class="btn" data-act="add-title">＋ Ajouter un titre</button></div>
    <div class="toolbar">
      <div class="seg" role="group" aria-label="Type">${[["all","Tendances"],["now","Du moment"],["film","Films"],["serie","Séries"]].map(([k,l]) => `<button data-type="${k}" aria-pressed="${ui.type===k}">${l}</button>`).join("")}</div>
      ${genreOk ? `<select class="input" id="genre" style="width:auto" aria-label="Genre"><option value="">Tous les genres</option>${Object.entries(gmap).sort((a,b) => a[1].localeCompare(b[1],"fr")).map(([id, n]) => `<option value="${id}" ${String(id)===String(ui.genre)?"selected":""}>${esc(n)}</option>`).join("")}</select>
      <select class="input" id="sort" style="width:auto" aria-label="Trier">${[["popular","Populaires"],["recent","Plus récents"],["rated","Mieux notés"],["unseen","Pas encore vus"]].map(([k,l]) => `<option value="${k}" ${k===ui.sort?"selected":""}>${l}</option>`).join("")}</select>` : ""}
      ${q ? `<button class="btn ghost small" data-act="clear-q">Effacer la recherche</button>` : ""}
    </div>
    ${list.length ? `<div class="grid">${list.map(f => cardHTML(f, [f.year, kindLabel(f.t)].filter(Boolean).join(" · "))).join("")}</div>` : ""}
    ${!fresh || browse.loading ? `<p class="muted" style="margin-top:20px">Chargement…</p>`
      : browse.error ? `<div class="empty"><h3>TMDB ne répond pas</h3><p>Vérifiez votre connexion puis réessayez.</p><button class="btn primary" data-act="retry-browse">Réessayer</button></div>`
      : !list.length ? `<div class="empty"><h3>Aucun titre trouvé</h3><p>Rien ne correspond${q ? ` à « ${esc(ui.q)} »` : ""} dans TMDB. Vous pouvez l'ajouter vous-même au catalogue.</p><button class="btn primary" data-act="add-title">Ajouter${q ? ` « ${esc(ui.q)} »` : " un titre"}</button></div>`
      : browse.page < browse.pages ? `<div style="display:flex;justify-content:center;margin-top:28px"><button class="btn" data-act="more-browse">Afficher plus</button></div>` : ""}
  </div>
  ${side ? `<aside class="side-rev" aria-labelledby="sideRevT"><h2 class="sec-title" id="sideRevT">${ICON.heart} Critiques les plus aimées</h2><div id="sideReviews">${topReviewsHTML()}</div></aside>` : ""}
  </div>`;
  $("#genre") && ($("#genre").onchange = e => { ui.genre = e.target.value; viewBrowse(); });
  $("#sort") && ($("#sort").onchange = e => { ui.sort = e.target.value; viewBrowse(); });
  $$("[data-type]").forEach(b => b.onclick = () => { ui.type = b.dataset.type; ui.genre = ""; viewBrowse(); });
}

let publicTimer = null;
function schedulePublic() {
  if (!remote || !votes.myId) return;
  clearTimeout(publicTimer);
  publicTimer = setTimeout(publishPublic, 2000);
}
async function publishPublic() {
  if (!remote || !votes.myId || !dbNS) return;
  const ref = dbNS.doc("public/" + votes.myId);
  try {
    if (!pref("public")) { await ref.delete(); return; }
    const p = state.profile, all = watchedList();
    const rated = Object.values(state.lib.entries).filter(e => e.rating);
    await ref.set({
      name: p.name || "", handle: p.handle || "", bio: (p.bio || "").slice(0, 280),
      avatar: p.avatar && p.avatar.length < 90000 ? p.avatar : "", plan: badgeId(),
      favFilms: p.favFilms, favSeries: p.favSeries, favActors: p.favActors.slice(0, 12), favDirectors: p.favDirectors.slice(0, 12),
      banner: p.banner || "", bannerImg: p.bannerImg && p.bannerImg.length < 200000 ? p.bannerImg : "", bannerH: p.bannerH || 0,
      accent: accentAllowed(p.accent) ? p.accent : "blanc", friends: p.friends.length, frame: p.frame || "",
      films: all.filter(x => x.f.t === "film").length, series: all.filter(x => x.f.t === "serie").length,
      reviews: Object.values(state.lib.entries).filter(e => e.review).length,
      avg: rated.length ? Math.round(rated.reduce((s,e) => s + e.rating, 0) / rated.length * 10) / 10 : 0,
      recent: all.sort((a,b) => (b.e.date||"").localeCompare(a.e.date||"")).slice(0, 8).map(x => ({id: x.f.id, r: x.e.rating || 0})),
      updatedAt: new Date().toISOString(),
    });
  } catch {}
}

/* ----- Profil d'un autre membre ----- */
const mb = {id: null, data: undefined, revs: [], at: 0, err: false};
async function loadMember(id) {
  Object.assign(mb, {id, data: undefined, revs: [], at: Date.now(), err: false});
  try {
    const [pub, revs, likes] = await Promise.all([
      auth.sb.from("public_profiles").select("data").eq("id", id).maybeSingle(),
      auth.sb.from("reviews").select("user_id,title_id,title,author,rating,text,spoiler,created_at,updated_at").eq("user_id", id).order("updated_at", {ascending: false}).limit(30),
      auth.sb.from("review_likes").select("user_id,title_id").eq("author_id", id),
    ]);
    if (mb.id !== id) return;
    if (pub.error || revs.error) throw pub.error || revs.error;
    mb.data = pub.data?.data || null;
    if (mb.data) { registerTitles(mb.data.titles); peopleCache[id] = {id, name: mb.data.name || (mb.data.handle ? "@" + mb.data.handle : ""), avatarUrl: mb.data.avatar || NO_AV, frame: mb.data.frame || ""}; }
    mb.revs = (revs.data || []).map(r => {
      const l = (likes.data || []).filter(x => x.title_id === r.title_id);
      if (r.title) registerTitles([r.title]);
      return {...r, likes: l.length, liked: l.some(x => x.user_id === myId())};
    });
  } catch (e) { if (mb.id === id) { mb.err = true; mb.data = null; } console.warn(e); }
  if (ui.view === "membre" && ui.member === id) viewMember();
}

/* ----- Statistiques (abonnés) ----- */
function viewingStats() {
  const all = watchedList(), films = all.filter(x => x.f.t === "film"), series = all.filter(x => x.f.t === "serie");
  const fMin = x => typeof x.f.len === "number" ? x.f.len : FILM_EST;
  const sEp = x => { const si = seriesInfo(x.f); return x.e.eps != null ? Math.min(x.e.eps, si.eps) : si.eps; };
  const sMin = x => sEp(x) * seriesInfo(x.f).m;
  const filmMin = films.reduce((s,x) => s + fMin(x), 0), seriesMin = series.reduce((s,x) => s + sMin(x), 0);
  const episodes = series.reduce((s,x) => s + sEp(x), 0);
  const filmEst = films.filter(x => typeof x.f.len !== "number").length, seriesEst = series.filter(x => seriesInfo(x.f).est).length;
  // activité des 6 derniers mois
  const d = new Date(), months = [];
  for (let i = 5; i >= 0; i--) { const m = new Date(d.getFullYear(), d.getMonth() - i, 15); months.push({k:`${m.getFullYear()}-${pad(m.getMonth()+1)}`, f:0, s:0}); }
  all.forEach(x => { const mo = months.find(m => x.e.date?.startsWith(m.k)); if (mo) x.f.t === "film" ? mo.f += fMin(x) : mo.s += sMin(x); });
  // genres (en heures), décennies, réalisateurs, acteurs, jours
  const genres = {}; all.forEach(x => { const g = x.f.genre || "Non classé"; genres[g] = (genres[g] || 0) + (x.f.t === "film" ? fMin(x) : sMin(x)); });
  const decades = {}; films.forEach(x => { if (x.f.year) { const k = Math.floor(x.f.year / 10) * 10; decades[k] = (decades[k] || 0) + 1; } });
  const dirs = {}; films.forEach(x => x.f.by.forEach(n => dirs[n] = (dirs[n] || 0) + 1));
  const actors = {}; all.forEach(x => x.f.cast.forEach(n => actors[n] = (actors[n] || 0) + 1));
  const days = Array(7).fill(0); all.forEach(x => { if (x.e.date) days[(new Date(x.e.date + "T12:00").getDay() + 6) % 7]++; });
  const avgOf = arr => { const r = arr.filter(x => x.e.rating); return r.length ? r.reduce((s,x) => s + x.e.rating, 0) / r.length : 0; };
  const top = (o, n) => Object.entries(o).sort((a,b) => b[1] - a[1]).slice(0, n);
  const longest = films.filter(x => typeof x.f.len === "number").sort((a,b) => b.f.len - a.f.len)[0];
  const oldest = films.filter(x => x.f.year).sort((a,b) => a.f.year - b.f.year)[0];
  const bigSeries = series.slice().sort((a,b) => sMin(b) - sMin(a))[0];
  const best = all.filter(x => x.e.rating).sort((a,b) => b.e.rating - a.e.rating || (b.e.date||"").localeCompare(a.e.date||""))[0];
  const year = String(d.getFullYear());
  return {films, series, filmMin, seriesMin, episodes, filmEst, seriesEst, months, genres:top(genres, 6), decades:Object.entries(decades).sort((a,b) => a[0] - b[0]),
    dirs:top(dirs, 5), actors:top(actors, 5), days, avgFilm:avgOf(films), avgSeries:avgOf(series),
    liked: all.filter(x => x.e.liked).length, disliked: all.filter(x => x.e.disliked).length, reviewed: all.filter(x => x.e.review).length,
    thisYear: all.filter(x => x.e.date?.startsWith(year)).length, year, longest, oldest, bigSeries, bigSeriesMin: bigSeries ? sMin(bigSeries) : 0, best, total: all.length};
}

let pickToken = 0, pickTimer = null;
function paintPicker(query) {
  clearTimeout(pickTimer);
  const q = query.trim(), my = ++pickToken;
  const local = () => {
    const seen = watchedList().filter(x => x.f.t === pickKind).sort((a,b) => (b.e.rating||0) - (a.e.rating||0)).map(x => x.f);
    const pool = pickKind === "film" ? [...NOW, ...CLASSICS] : [...NOW_SERIES, ...CLASSICS];
    return [...new Set([...seen, ...pool.filter(f => f.t === pickKind)])];
  };
  if (!q) { drawPicker(local(), "Vos titres vus d'abord, puis des titres populaires. Tapez pour chercher dans tout TMDB."); return; }
  $("#pickMeta").textContent = "Recherche…";
  pickTimer = setTimeout(async () => {
    try {
      const res = await tmdb(`/search/${pickKind === "film" ? "movie" : "tv"}`, {query: q, include_adult: "false"});
      if (my !== pickToken) return;
      const list = res.results.map(r => fromTmdb(r, pickKind === "film" ? "movie" : "tv")).filter(Boolean);
      drawPicker(list, `${res.total_results} résultat${res.total_results > 1 ? "s" : ""} sur TMDB`);
    } catch { if (my === pickToken) $("#pickMeta").textContent = "TMDB ne répond pas. Réessayez dans un instant."; }
  }, 280);
}
function drawPicker(list, meta) {
  const favKey = pickKind === "film" ? "favFilms" : "favSeries", favs = state.profile[favKey];
  $("#pickMeta").textContent = meta;
  $("#pickGrid").innerHTML = list.length ? list.slice(0, 60).map(f => {
    const on = favs.includes(f.id), e = E(f.id);
    return `<button class="card pick-card ${on ? "picked" : ""}" data-pick="${esc(f.id)}" aria-label="${esc(f.title)}${on ? ", déjà dans vos favoris" : ""}">${poster(f, {mini:true})}${on ? `<span class="pick-on">★ Favori</span>` : ""}<span class="ct">${esc(f.title)}</span><span class="cs">${f.year || ""}${e?.watched ? " · vu" : ""}${e?.rating ? ` · <span class="stars-s">${starsText(e.rating)}</span>` : ""}</span></button>`;

  });
}

      <button class="btn" data-p3d-spin aria-pressed="${!reducedMotion() && pref("spin")}">Rotation auto</button>
      <button class="btn" data-p3d-flip>Voir le dos</button>
    </div>`;
  const dlg = $("#dlgPoster");
  if (!dlg.open) dlg.showModal();
  const reduce = reducedMotion();
  p3 = {rx:-6, ry:reduce ? 0 : -360, vx:0, vy:0, drag:false, spin:!reduce && pref("spin"), tween: reduce ? null : {from:-360, to:0, t0:performance.now(), dur:1400}};
  const stage = $("#p3dStage");
  let lx = 0, ly = 0;
  stage.addEventListener("pointerdown", ev => { p3.drag = true; p3.tween = null; lx = ev.clientX; ly = ev.clientY; stage.setPointerCapture(ev.pointerId); });
  stage.addEventListener("pointermove", ev => {
    if (!p3?.drag) return;
    const dx = ev.clientX - lx, dy = ev.clientY - ly; lx = ev.clientX; ly = ev.clientY;
    p3.vy = dx * .45; p3.vx = -dy * .3;
    p3.ry += p3.vy; p3.rx = Math.max(-45, Math.min(45, p3.rx + p3.vx));
  });
  const end = () => { if (p3) p3.drag = false; };
  stage.addEventListener("pointerup", end); stage.addEventListener("pointercancel", end);
  stage.addEventListener("keydown", ev => {
    const step = {ArrowLeft:-30, ArrowRight:30}[ev.key];
    if (step) { ev.preventDefault(); p3.tween = {from:p3.ry, to:p3.ry + step, t0:performance.now(), dur:350}; }
    if (ev.key === "ArrowUp" || ev.key === "ArrowDown") { ev.preventDefault(); p3.rx = Math.max(-45, Math.min(45, p3.rx + (ev.key === "ArrowUp" ? 10 : -10))); }
  });
  stage.focus({preventScroll:true});
  requestAnimationFrame(p3Frame);
}
function p3Frame(now) {
  if (!p3) return;
  const box = $("#box3d"); if (!box) { p3 = null; return; }
  if (p3.tween) {
    const t = Math.min(1, (now - p3.tween.t0) / p3.tween.dur), k = 1 - Math.pow(1 - t, 3);
    p3.ry = p3.tween.from + (p3.tween.to - p3.tween.from) * k;
    if (t >= 1) p3.tween = null;
  } else if (!p3.drag) {
    p3.ry += p3.vy; p3.vy *= .95;
    p3.rx += (-6 - p3.rx) * .04;
    if (p3.spin && Math.abs(p3.vy) < .2) p3.ry += .2;
  }
  box.style.transform = `rotateX(${p3.rx}deg) rotateY(${p3.ry}deg)`;
  const n = ((p3.ry % 360) + 360) % 360;
  box.style.setProperty("--sx", `${100 - (n / 360) * 100}%`);
  const flip = $("[data-p3d-flip]");
  if (flip) { const back = Math.cos(p3.ry * Math.PI / 180) < 0, txt = back ? "Voir la face" : "Voir le dos"; if (flip.textContent !== txt) flip.textContent = txt; }
  requestAnimationFrame(p3Frame);
}
$("#dlgPoster").addEventListener("click", ev => {
  const t = ev.target;
  if (t.closest("[data-p3d-close]")) { $("#dlgPoster").close(); return; }
  if (t.closest("[data-p3d-spin]")) { p3.spin = !p3.spin; t.closest("[data-p3d-spin]").setAttribute("aria-pressed", p3.spin); return; }
  if (t.closest("[data-p3d-flip]")) {
    const back = Math.cos(p3.ry * Math.PI / 180) < 0;
    const to = back ? Math.round(p3.ry / 360) * 360 : Math.round((p3.ry - 180) / 360) * 360 + 180;
    p3.vy = 0; p3.tween = {from:p3.ry, to, t0:performance.now(), dur:reducedMotion() ? 1 : 700};
  }
});
$("#dlgPoster").addEventListener("close", () => { p3 = null; $("#p3d").innerHTML = ""; });

let dive = null;
function enterTrailer() {
  const f = byId(curId); if (!f || dive) return;
  const dlg = $("#dlgDetail"), dvd = $("#detail .dvd"), hole = $("#detail .disc-hole");
  const hr = hole.getBoundingClientRect(), dr = dvd.getBoundingClientRect();

  const iris = document.createElement("div"); iris.className = "iris";
  iris.style.cssText = `left:${cx - hr.width/2}px;top:${cy - hr.height/2}px;width:${hr.width}px;height:${hr.height}px`;

  const steps = Array.from({length:16}, (_, k) => { const t = k / 15, e = t * t * (3 - 2 * t); return {offset:t, sc:Math.pow(cover, e), rot:70 * e}; });

  dive.anims.push(zoom);
  dive.anims.push(iris.animate(steps.map(k => ({offset:k.offset, transform:`scale(${k.sc})`})), {duration:D*T, easing:"cubic-bezier(.45,0,.55,1)", fill:"forwards"}));

        ${tr ? `<div class="yt"><iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(tr)}?autoplay=${pref("autoplay") ? 1 : 0}&rel=0&modestbranding=1&playsinline=1" title="Bande-annonce de ${esc(f.title)}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe></div>`
             : `<div class="t-none" style="${bg}"><div><b style="font-size:18px">Pas de bande-annonce sur TMDB pour ce titre</b><a class="btn primary" href="https://www.youtube.com/results?search_query=${encodeURIComponent(f.title + " bande annonce")}" target="_blank" rel="noopener">Chercher sur YouTube</a></div></div>`}
      </div>`;
    dlg.appendChild(th); dive.theater = th;
    th.animate([{opacity:0}, {opacity:1}], {duration:350*T, easing:"ease-out", fill:"both"});
    $(".t-back", th).focus();
  };

}
function exitTrailer(instant = false) {

// Le site garde la même logique que la version claude.ai : on lui fournit un « db » et un « user »
// qui parlent à Supabase. Clés publiques lues dans /api/config (variables Vercel) ; la sécurité vient des règles RLS.
const auth = {sb: null, user: null, admin: false, ready: false};
const NO_AV = "data:image/svg+xml," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40"><rect width="40" height="40" rx="20" fill="#2d2d35"/><circle cx="20" cy="16" r="7" fill="#9a9aa4"/><path d="M7 36c2-8 8-11 13-11s11 3 13 11" fill="#9a9aa4"/></svg>');
const registerTitles = list => (list || []).forEach(t => { if (t?.id && !byId(t.id)) TITLES[t.id] = {...t}; });
const titlesFor = ids => [...new Set(ids)].map(byId).filter(f => f && !f.custom).map(slimTitle);
function sbRoute(path) {
  let m;
  if ((m = path.match(/^data\/users\/([^/]+)\/(profile|library)$/))) return {table: m[2] === "profile" ? "profiles" : "libraries", key: "id", id: m[1]};
  if ((m = path.match(/^public\/(.+)$/))) return {table: "public_profiles", key: "id", id: m[1], kind: "public"};
  if ((m = path.match(/^support\/(.+)$/))) return {table: "support_threads", key: "user_id", id: m[1], live: true};
  if (path === "reco/list") return {table: "reco", key: "id", id: 1, kind: "reco", live: true};
  throw new Error("Chemin inconnu : " + path);
}
const snapOf = (exists, data) => ({exists, data: () => data, metadata: {hasPendingWrites: false, fromCache: false}});
let chanSeq = 0;
function liveChannel(table, cb) {
  return auth.sb.channel(`rt-${table}-${++chanSeq}`).on("postgres_changes", {event: "*", schema: "public", table}, cb).subscribe();
}
const sbDB = {
  doc(path) {
    const r = sbRoute(path);
    const ref = {
      async get() {
        const {data, error} = await auth.sb.from(r.table).select("data").eq(r.key, r.id).maybeSingle();
        if (error) throw {code: "unavailable", message: error.message};
        if (data && r.kind) registerTitles(data.data?.titles);
        return snapOf(!!data, data ? data.data : undefined);
      },
      async set(body) {
        if (r.kind === "reco") body = {...body, titles: titlesFor([...(body.ids || []), ...(body.featured || [])])};
        if (r.kind === "public") body = {...body, titles: titlesFor([...(body.favFilms || []), ...(body.favSeries || []), ...(body.recent || []).map(x => x.id), body.banner].filter(Boolean))};
        const {error} = await auth.sb.from(r.table).upsert({[r.key]: r.id, data: body, updated_at: new Date().toISOString()});
        if (error) throw {code: "invalid_argument", message: error.message};
      },
      async delete() { await auth.sb.from(r.table).delete().eq(r.key, r.id); },
      onSnapshot(next, err) {
        let live = true;
        const run = () => ref.get().then(s => live && next(s)).catch(e => err && err(e));
        run();
        const ch = r.live ? liveChannel(r.table, run) : null;
        return () => { live = false; if (ch) auth.sb.removeChannel(ch); };
      },
    };
    return ref;
  },
  collection(path) {
    if (path === "votes") return {
      onSnapshot(next, err) {
        let live = true;
        const run = async () => {
          const {data, error} = await auth.sb.from("votes").select("user_id,month,title_id,title");
          if (error) { err && err(error); return; }
          const byUser = {};
          (data || []).forEach(v => { (byUser[v.user_id] ||= {})[v.month] = v.title_id; if (v.title) registerTitles([v.title]); });
          if (live) next({docs: Object.entries(byUser).map(([id, d]) => ({id, data: () => d}))});
        };
        run();
        const ch = liveChannel("votes", run);
        return () => { live = false; auth.sb.removeChannel(ch); };
      },
      doc(uid) {
        return {async set(body) {
          const k = monthKey(), id = body[k];
          const q = id
            ? auth.sb.from("votes").upsert({user_id: uid, month: k, title_id: id, title: byId(id) ? slimTitle(byId(id)) : null})
            : auth.sb.from("votes").delete().match({user_id: uid, month: k});
          const {error} = await q; if (error) throw error;
        }};
      },
    };
    if (path === "support") return {
      onSnapshot(next, err) {
        let live = true;
        const run = async () => {
          const {data, error} = await auth.sb.from("support_threads").select("user_id,data");
          if (error) { err && err(error); return; }
          if (live) next({docs: (data || []).map(row => ({id: row.user_id, data: () => row.data || {}}))});
        };
        run();
        const ch = liveChannel("support_threads", run);
        return () => { live = false; auth.sb.removeChannel(ch); };
      },
    };
    throw new Error("Collection inconnue : " + path);
  },
};

const QUIZ_N = 10, QUIZ_SEC = 20, QUIZ_PASS = 7;
const LEVELS = [{min: 0, name: "Figurant"}, {min: 150, name: "Second rôle"}, {min: 500, name: "Premier rôle"}, {min: 1200, name: "Réalisateur·rice"}, {min: 2500, name: "Palme d'or"}];
const levelIdx = pts => LEVELS.reduce((k, l, i) => pts >= l.min ? i : k, 0);
const quizBadge = pts => { const i = levelIdx(pts || 0); return `<span class="qz-badge l${i}">${esc(LEVELS[i].name)}</span>`; };
const MEDALS = ["🥇", "🥈", "🥉"];
const quiz = {phase: "intro", qs: [], i: 0, correct: 0, points: 0, picked: null, answers: [], deadline: 0, timer: null, err: "", saved: null,
  board: {month: [], all: [], at: 0, err: false}, boardLoading: false, tab: "month", mine: null};
const myQuiz = () => auth.user ? (quiz.mine || {points: 0, quizzes: 0, passed: 0, best: 0}) : (state.lib.quiz || {points: 0, quizzes: 0, passed: 0, best: 0});
function myQuizBadge() {
  const q = myQuiz(); if (!q.quizzes) return "";
  const rank = auth.user ? quiz.board.month.findIndex(r => r.user_id === myId()) : -1;
  return `${quizBadge(q.points)}${rank >= 0 && rank < 3 ? `<span class="qz-badge l4" title="Podium du quiz ce mois-ci">${MEDALS[rank]} Champion du mois</span>` : ""}`;
}
async function loadBoard(force) {
  if (!auth.sb || quiz.boardLoading || (!force && quiz.board.at && Date.now() - quiz.board.at < 60000)) return;
  quiz.boardLoading = true;
  const cols = "user_id,name,points,quizzes,passed,month,month_points,month_passed";
  const [a, b, c] = await Promise.all([
    auth.sb.from("quiz_scores").select(cols).eq("month", monthKey()).gt("month_points", 0).order("month_points", {ascending: false}).order("month_passed", {ascending: false}).limit(20),
    auth.sb.from("quiz_scores").select(cols).order("points", {ascending: false}).order("passed", {ascending: false}).limit(20),
    auth.user ? auth.sb.from("quiz_scores").select("*").eq("user_id", myId()).maybeSingle() : Promise.resolve({data: null}),
  ]);
  quiz.boardLoading = false;
  quiz.board = {month: a.data || [], all: b.data || [], at: Date.now(), err: !!(a.error || b.error)};
  if (auth.user && !c.error) quiz.mine = c.data;
  await loadPeople([...quiz.board.month, ...quiz.board.all].map(r => r.user_id));
  if (ui.view === "quiz" && quiz.phase !== "play") viewQuiz();
  const pod = $("#homePodium"); if (pod) pod.innerHTML = podiumHTML();
  if (ui.view === "profil") viewProfile();
}
function podiumHTML() {
  if (!quiz.board.at) { loadBoard(); return `<p class="muted">Chargement du classement…</p>`; }
  const top = quiz.board.month.slice(0, 3);
  // ordre d'un vrai podium : 2e à gauche, 1er au centre (plus haut), 3e à droite
  const spot = i => { const r = top[i];
    return `<div class="pd pd${i + 1}">
      <div class="pd-who">${r ? `<button class="crev-user" data-user="${esc(r.user_id)}" aria-label="Voir le profil">${avHTML(r.user_id, r.name)}</button><b><button class="linkish plain" data-user="${esc(r.user_id)}">${esc(r.name || "Cinéphile")}</button></b><small><b class="num">${r.month_points}</b> pts</small>` : `<span class="bb-av">?</span><small>Place libre</small>`}</div>
      <div class="pd-step" aria-label="${i + 1}${i ? "e" : "er"} place"><span>${i + 1}</span></div>
    </div>`; };
  return `<div class="podium3">${spot(1)}${spot(0)}${spot(2)}</div>
    ${top.length ? "" : `<p class="note" style="text-align:center;margin:10px 0 0">Personne n'a encore joué ce mois-ci. <a href="#quiz" style="color:var(--fg)">Lancez le premier quiz</a> !</p>`}`;
}
function boardHTML() {
  const monthly = quiz.tab === "month", rows = monthly ? quiz.board.month : quiz.board.all;
  if (!quiz.board.at) return `<p class="muted">Chargement du classement…</p>`;
  if (quiz.board.err) return `<p class="muted">Classement indisponible. Le créateur doit lancer supabase-etape3.sql dans Supabase.</p>`;
  if (!rows.length) return `<p class="muted">${monthly ? "Personne n'a encore marqué de points ce mois-ci." : "Personne n'a encore joué."} À vous de jouer !</p>`;
  return `<div class="board">${rows.map((r, i) => `<div class="brow ${r.user_id === myId() ? "me" : ""}">
    <span class="rk">${i < 3 ? MEDALS[i] : i + 1}</span><button class="crev-user" data-user="${esc(r.user_id)}" aria-label="Voir le profil">${avHTML(r.user_id, r.name)}</button>
    <span class="bn"><b><button class="linkish plain" data-user="${esc(r.user_id)}">${esc(r.name || "Cinéphile")}</button>${r.user_id === myId() ? ` <span class="tag-ex">vous</span>` : ""}</b><small>${quizBadge(r.points)} · ${monthly ? r.month_passed : r.passed} réussi${(monthly ? r.month_passed : r.passed) > 1 ? "s" : ""} sur ${r.quizzes} joué${r.quizzes > 1 ? "s" : ""}</small></span>
    <span class="bp num">${monthly ? r.month_points : r.points}<small>points</small></span></div>`).join("")}</div>`;
}
const maskTitle = (txt, title) => {
  let out = txt.length > 420 ? txt.slice(0, 417).replace(/\s+\S*$/, "") + "…" : txt;
  title.split(/[\s:,'’\-–!?.()]+/).filter(w => w.length > 3).forEach(w => { out = out.replace(new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi"), "•••"); });
  return out;
};
async function buildQuiz() {
  const rnd = n => 1 + Math.floor(Math.random() * n);
  const lists = await Promise.all([
    tmdb("/movie/top_rated", {page: rnd(25)}), tmdb("/movie/top_rated", {page: rnd(25)}),
    tmdb("/movie/popular", {page: rnd(15)}), tmdb("/discover/movie", {sort_by: "vote_count.desc", page: rnd(25)})]);
  const seen = new Set();
  const pool = shuffle(lists.flatMap(l => l.results || []).filter(m => m.poster_path && m.backdrop_path && m.overview && m.release_date && !seen.has(m.id) && seen.add(m.id)));
  if (pool.length < QUIZ_N + 6) throw new Error("Pas assez de films pour composer un quiz. Réessayez.");
  const subjects = pool.slice(0, QUIZ_N), extras = pool.slice(QUIZ_N, QUIZ_N + 8);
  const details = await Promise.all([...subjects, ...extras].map(m => tmdb(`/movie/${m.id}`, {append_to_response: "credits"}).catch(() => null)));
  const dirOf = d => (d?.credits?.crew || []).find(p => p.job === "Director")?.name;
  const castOf = d => (d?.credits?.cast || []).slice(0, 5).map(p => p.name);
  const allDirs = [...new Set(details.map(dirOf).filter(Boolean))];
  const allCast = [...new Set(details.flatMap(d => castOf(d).slice(0, 3)))];
  const thisYear = new Date().getFullYear();
  const types = shuffle(["year", "dir", "still", "synopsis", "actor", "year", "dir", "still", "synopsis", "actor"]);
  return subjects.map((m, i) => {
    const d = details[i], dir = dirOf(d), cast = castOf(d), year = +m.release_date.slice(0, 4);
    let type = types[i];
    if (type === "dir" && (!dir || allDirs.filter(x => x !== dir).length < 3)) type = "year";
    if (type === "actor" && (!cast.length || allCast.filter(x => !cast.includes(x)).length < 3)) type = "still";
    const otherTitles = () => [...new Set(shuffle(pool).filter(x => x.id !== m.id && x.title !== m.title).map(x => x.title))].slice(0, 3);
    let q;
    if (type === "year") {
      const ys = new Set([year]);
      while (ys.size < 4) { const y = year + (Math.random() < .5 ? -1 : 1) * (1 + Math.floor(Math.random() * 6)); if (y <= thisYear && y > 1900) ys.add(y); }
      q = {text: `En quelle année est sorti « ${m.title} » ?`, answer: String(year), options: [...ys].map(String), img: m.backdrop_path};
    } else if (type === "dir") {
      q = {text: `Qui a réalisé « ${m.title} » ?`, answer: dir, options: [dir, ...shuffle(allDirs.filter(x => x !== dir)).slice(0, 3)], img: m.backdrop_path};
    } else if (type === "actor") {
      const a = cast[Math.floor(Math.random() * Math.min(3, cast.length))];
      q = {text: `Qui joue dans « ${m.title} » ?`, answer: a, options: [a, ...shuffle(allCast.filter(x => !cast.includes(x))).slice(0, 3)]};
    } else if (type === "still") {
      q = {text: "De quel film est tirée cette image ?", answer: m.title, options: [m.title, ...otherTitles()], img: m.backdrop_path};
    } else {
      q = {text: "De quel film est ce résumé ?", answer: m.title, options: [m.title, ...otherTitles()], synopsis: maskTitle(m.overview, m.title)};
    }
    q.options = shuffle(q.options);
    q.film = fromTmdb(m, "movie")?.id;
    return q;
  });
}
const paintQuiz = () => { if (ui.view === "quiz") viewQuiz(); };
async function startQuiz() {
  clearInterval(quiz.timer);
  Object.assign(quiz, {phase: "loading", err: ""}); paintQuiz();
  try { quiz.qs = await buildQuiz(); }
  catch (e) { quiz.phase = "intro"; quiz.err = e?.status || e?.name === "AbortError" ? tmdbProblem(e) : String(e?.message || e); paintQuiz(); return; }
  Object.assign(quiz, {phase: "play", i: 0, correct: 0, points: 0, answers: [], saved: null});
  askQuestion();
}
function askQuestion() {
  quiz.picked = null; quiz.deadline = Date.now() + QUIZ_SEC * 1000;
  runQuizTimer(); paintQuiz();
}
function runQuizTimer() { clearInterval(quiz.timer); quiz.timer = setInterval(tickQuiz, 250); }
function abandonQuiz() { clearInterval(quiz.timer); quiz.phase = "intro"; toast("Quiz abandonné : vous avez quitté l'onglet Quiz."); }
function tickQuiz() {
  if (quiz.phase !== "play" || quiz.picked != null) { clearInterval(quiz.timer); return; }
  if (ui.view !== "quiz") { abandonQuiz(); return; }
  const left = quiz.deadline - Date.now();
  const bar = $("#qzTime"), sec = $("#qzSec");
  if (bar) { $("i", bar).style.width = Math.max(0, left / (QUIZ_SEC * 10)) + "%"; bar.classList.toggle("low", left < 5000); }
  if (sec) sec.textContent = Math.max(0, Math.ceil(left / 1000));
  if (left <= 0) answerQuiz(-1);
}
function answerQuiz(idx) {
  if (quiz.phase !== "play" || quiz.picked != null) return;
  clearInterval(quiz.timer);
  const q = quiz.qs[quiz.i], ok = idx >= 0 && q.options[idx] === q.answer;
  const left = Math.max(0, quiz.deadline - Date.now());
  const pts = ok ? 10 + Math.min(5, Math.ceil(left / 4000)) : 0; // 10 points + bonus de rapidité (5 au plus)
  quiz.picked = idx; quiz.answers.push({ok, pts});
  if (ok) { quiz.correct++; quiz.points += pts; }
  paintQuiz();
  const at = quiz.i;
  setTimeout(() => {
    if (quiz.phase !== "play" || quiz.i !== at) return;
    if (ui.view !== "quiz") { abandonQuiz(); return; }
    quiz.i++;
    quiz.i < quiz.qs.length ? askQuestion() : finishQuiz();
  }, ok ? 1100 : 2000);
}
async function finishQuiz() {
  quiz.phase = "done";
  const before = myQuiz().points || 0, passed = quiz.correct >= QUIZ_PASS;
  if (auth.user) {
    quiz.saved = {pending: true}; paintQuiz();
    const {data, error} = await auth.sb.rpc("record_quiz", {p_correct: quiz.correct, p_total: QUIZ_N, p_points: quiz.points, p_name: myName()});
    if (error) quiz.saved = {error: /Trop rapide/.test(error.message) ? "Score non compté : attendez quelques secondes entre deux quiz." : "Le score n'a pas pu être enregistré."};
    else { quiz.mine = Array.isArray(data) ? data[0] : data; quiz.saved = {ok: true}; }
  } else {
    const s = state.lib.quiz = {points: 0, quizzes: 0, passed: 0, best: 0, ...(state.lib.quiz || {})};
    s.points += quiz.points; s.quizzes++; s.passed += passed ? 1 : 0; s.best = Math.max(s.best, quiz.correct);
    save("lib"); quiz.saved = {local: true};
  }
  const after = myQuiz().points || 0;
  if (levelIdx(after) > levelIdx(before)) {
    const level = LEVELS[levelIdx(after)].name;
    toast(`Nouveau grade : ${level} !`);
    notify(myId(), "quiz", {level});
  }
  paintQuiz(); loadBoard(true);
}

document.addEventListener("keydown", ev => {
